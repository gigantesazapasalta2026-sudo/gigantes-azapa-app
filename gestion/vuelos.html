<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vuelos Santiago · Gestión</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8}.top{background:#0b0f14;color:white;padding:18px}.in,main{max-width:1200px;margin:auto}.top a{color:#f6a16f;text-decoration:none}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:16px;margin:14px 0}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 120px;gap:9px;padding:10px 0;border-top:1px solid #eee;align-items:center}.row:first-child{border-top:0}.meta{font-size:11px;color:var(--m)}.badge{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#fef3c7;color:#92400e}.ok{background:#dcfce7;color:#166534}.hide{display:none}@media(max-width:780px){.row{grid-template-columns:1fr 1fr}.row>*:nth-child(4){display:none}}</style></head><body>
<header class="top"><div class="in"><h1>✈️ Vuelos y transfers · Santiago 2026</h1><a href="index.html">← Control Center</a></div></header><main><div id="loading" class="card">Verificando acceso…</div><section id="app" class="hide"><div class="card"><b id="count">0</b> registros de viaje cargados. Ordena por llegada para definir ventanas de transfer.</div><div class="card"><h2>Llegadas a Santiago</h2><div id="arrivals"></div></div><div class="card"><h2>Regresos</h2><div id="returns"></div></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=vuelos.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p||!p.active||!['superadmin','board','coach'].includes(p.role)){loading.textContent='Sin permisos.';return}const pr=await sb.from('projects').select('id').eq('code','SCL2026').single();const {data:f}=await sb.from('travel_flight_details').select('*').eq('project_id',pr.data.id).order('arrival_at',{ascending:true});const ids=[...new Set((f||[]).map(x=>x.person_id))];let map={};if(ids.length){const pe=await sb.from('people').select('id,full_name,category').in('id',ids);map=Object.fromEntries((pe.data||[]).map(x=>[x.id,x]))}loading.classList.add('hide');app.classList.remove('hide');count.textContent=(f||[]).length;arrivals.innerHTML=render((f||[]).filter(x=>x.segment_type==='outbound'),map,'Sin llegadas registradas.');returns.innerHTML=render((f||[]).filter(x=>x.segment_type==='return').sort((a,b)=>new Date(a.departure_at||0)-new Date(b.departure_at||0)),map,'Sin regresos registrados.')})();
function render(rows,map,empty){return rows.length?rows.map(x=>{const p=map[x.person_id]||{};const t=x.segment_type==='outbound'?x.arrival_at:x.departure_at;return '<div class="row"><div><b>'+esc(p.full_name||'Viajero')+'</b><div class="meta">'+esc(p.category||'')+'</div></div><div><b>'+esc(x.carrier||'—')+' '+esc(x.service_number||'')+'</b><div class="meta">'+esc(x.origin||'')+' → '+esc(x.destination||'')+'</div></div><div>'+fmt(t)+'</div><div>'+ (x.transfer_required?'🚐 Transfer requerido':'Sin transfer')+'</div><span class="badge '+(x.ticket_confirmed?'ok':'')+'">'+(x.ticket_confirmed?'Comprado':'Pendiente')+'</span></div>'}).join(''):'<p class="meta">'+empty+'</p>'}
function fmt(v){return v?new Date(v).toLocaleString('es-CL'):'Sin hora'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
