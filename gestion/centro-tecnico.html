<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Centro Técnico · Gigantes de Azapa</title>
<style>:root{--orange:#ed6b24;--ink:#16212e;--border:#dde3ec}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font:14px/1.5 system-ui;color:var(--ink)}header{background:#121922;color:white;padding:20px max(18px,calc((100% - 1180px)/2))}header h1{font-size:25px;margin:0}header a{color:#fff}.top{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.mark{background:var(--orange);padding:8px 12px;border-radius:12px;font-size:26px;font-weight:900}main{max-width:1180px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,.btn{font:inherit;border:1px solid var(--border);background:white;color:var(--ink);padding:10px 13px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700}button.primary,.btn.primary{background:var(--orange);color:white;border-color:var(--orange)}button.active{background:#1b2735;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}.card{background:white;border:1px solid var(--border);border-radius:14px;padding:17px;margin-bottom:13px}.card h2{font-size:17px;margin:0 0 9px}.metric{font-size:30px;font-weight:900}.muted{color:#667085;font-size:12px}.line{padding:12px 0;border-top:1px solid #edf0f4}.line:first-child{border:0}.tag{font-size:11px;font-weight:800;background:#fff2e8;color:#9e4c14;border-radius:30px;padding:5px 9px;display:inline-block}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}select,input,textarea{font:inherit;padding:10px;border:1px solid #cfd6df;border-radius:9px;max-width:100%}.form label{display:block;margin:12px 0 4px;font-weight:750}.form input,.form textarea,.form select{width:100%}.form textarea{height:80px} .notice{border:1px solid #f1caab;background:#fff8f1;color:#774115;padding:12px;border-radius:10px;margin:10px 0}.err{background:#fff1f0;color:#9d302d}.hidden{display:none!important}small{font-size:11px;color:#667085}a{color:#b44f17}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #e7ecf1;padding:10px;vertical-align:top}th{font-size:11px;color:#667085}@media(max-width:790px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}header{padding:17px}main{padding:14px}}@media(max-width:440px){.grid{grid-template-columns:1fr 1fr}.card{padding:13px}}</style></head>
<body><header><div class="top"><span class="mark">G</span><div><h1>Centro Técnico Gigantes</h1><span style="color:#ddd">Planificación · Asistencia · Supervisión deportiva</span></div><span style="flex:1"></span><a href="index.html">Control Center</a></div></header>
<main><div class="row"><p id="ident" class="muted">Comprobando acceso…</p><a class="btn" href="../mi_gigantes.html">Mi Gigantes</a></div><div id="notice"></div><div class="filters"><label> Categoría <select id="team"><option value="all">Todas mis categorías</option></select></label></div>
<div id="metrics" class="grid"></div><nav id="tabs"><button data-tab="resumen" class="active">Resumen</button><button data-tab="planes">Planificaciones</button><button data-tab="sesiones">Entrenamientos</button><a class="btn primary" href="asistencia-entrenadores.html">✅ Pase de lista</a><a class="btn" href="plantel-entrenadores.html">👥 Mi plantel</a><button data-tab="revision">Revisión de planes</button><a class="btn primary" href="biblioteca-ejercicios.html">📚 Biblioteca de ejercicios</a><button data-tab="academia">Academia</button></nav><div id="view"></div></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app={db:null,profile:null,teams:[],plans:[],sessions:[],attendance:[],members:[],files:[],reviews:[],assign:[],tab:'resumen',selected:'all'};
const admin=()=>['superadmin','board'].includes(app.profile?.role);
const visible=list=>list.filter(x=>app.selected==='all'||x.team_id===app.selected);
const teamName=id=>app.teams.find(t=>t.id===id)?.name||'Categoría';
const date=x=>x?new Date(x).toLocaleDateString('es-CL'):'Sin fecha';
function notice(s,error=false){$('notice').innerHTML=s?'<div class="notice '+(error?'err':'')+'">'+esc(s)+'</div>':'';}
function metric(label,value,hint){return '<div class="card"><small>'+esc(label)+'</small><div class="metric">'+esc(value)+'</div><small>'+esc(hint)+'</small></div>'}
function render(){const ps=visible(app.plans),ss=visible(app.sessions),ids=new Set(ss.map(s=>s.id)),att=app.attendance.filter(a=>ids.has(a.session_id));$('metrics').innerHTML=metric('Categorías',app.selected==='all'?app.teams.length:1,'Con acceso técnico')+metric('Planificaciones',ps.length,'4 marcos formativos iniciales')+metric('Entrenamientos',ss.length,'Sesiones registradas')+metric('Asistencias',att.length,'Registros individuales');
document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===app.tab));$('view').innerHTML=app.tab==='resumen'?summary():app.tab==='planes'?plansView():app.tab==='sesiones'?sessionsView():app.tab==='revision'?reviewsView():academyView();wire();}
function summary(){const ts=app.teams.filter(t=>app.selected==='all'||t.id===app.selected);return '<div class="two"><section class="card"><h2>Estado por categoría</h2>'+ts.map(t=>{const p=app.plans.filter(x=>x.team_id===t.id),s=app.sessions.filter(x=>x.team_id===t.id),m=app.members.filter(x=>x.team_id===t.id&&x.active);return '<div class="line"><div class="row"><b>'+esc(t.name)+'</b><span class="tag">'+p.length+' planes · '+s.length+' sesiones</span></div><small>'+m.length+' jugadores vinculados · '+(s.filter(x=>x.status==='completed').length)+' sesiones completadas</small></div>'}).join('')+'</section><section class="card"><h2>Acciones rápidas</h2><p class="muted">Se utilizan los formularios existentes. Los registros permanecen en una sola base de datos.</p><a class="btn primary" href="formacion.html">Crear planificación</a> <a class="btn" href="desarrollo-jugadores.html">Planificar sesiones</a> <a class="btn primary" href="asistencia-entrenadores.html">Pasar lista</a> <a class="btn" href="plantel-entrenadores.html">Gestionar plantel</a> <a class="btn" href="biblioteca-ejercicios.html">Biblioteca y propuestas</a><div class="line"><b>Flujo recomendado</b><p>1. Planifica → 2. Ejecuta → 3. Marca asistencia → 4. Cierra la sesión → 5. Revisa evolución.</p></div><div class="notice">La directiva puede revisar todas las categorías. Los entrenadores solo acceden a sus equipos asignados. Las evaluaciones individuales de menores no se publican.</div></section></div>'}
function lastReview(id){return app.reviews.filter(x=>x.plan_id===id).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0]}
function reviewStatus(id){const r=lastReview(id);return r?({submitted:'En revisión',approved:'Aprobado',changes_requested:'Con observaciones'}[r.action]||r.action):'Sin revisión'}
function plansView(){return '<div class="two"><section class="card"><h2>Planes registrados</h2>'+visible(app.plans).map(p=>'<div class="line"><div class="row"><b>'+esc(p.title)+'</b><span class="tag">'+esc(reviewStatus(p.id))+'</span></div><small>'+esc(teamName(p.team_id))+' · '+esc(p.period_type)+' · '+esc(p.status)+'</small><div style="margin-top:7px"><button class="openFiles" data-id="'+p.id+'">Adjuntos / revisión</button></div></div>').join('')+'<a class="btn primary" href="formacion.html">Crear o editar plan</a></section><section class="card"><h2>Documentos y revisión</h2><div id="planTools" class="muted">Selecciona una planificación para subir PDF/Word o enviarla a revisión.</div></section></div>'}
function sessionsView(){const ss=visible(app.sessions).sort((a,b)=>String(b.session_date).localeCompare(String(a.session_date)));return '<section class="card"><h2>Entrenamientos y control de asistencia</h2><p class="muted">El registro se realiza en la sesión original para evitar duplicados.</p>'+ (ss.length?'<table><tr><th>Fecha</th><th>Categoría</th><th>Sesión</th><th>Asistencia</th></tr>'+ss.map(s=>{const a=app.attendance.filter(x=>x.session_id===s.id),present=a.filter(x=>['present','late'].includes(x.attendance_status)).length;return '<tr><td>'+esc(s.session_date)+'</td><td>'+esc(teamName(s.team_id))+'</td><td>'+esc(s.title)+'</td><td>'+(a.length?present+'/'+a.length:'Pendiente')+'</td></tr>'}).join('')+'</table>':'<div class="notice">Aún no hay sesiones registradas en las categorías seleccionadas.</div>')+'<p><a class="btn primary" href="asistencia-entrenadores.html">Marcar asistencia</a> <a class="btn" href="desarrollo-jugadores.html">Planificar entrenamiento</a></p></section>'}
function reviewsView(){const ps=visible(app.plans);return '<section class="card"><h2>'+ (admin()?'Revisión de dirección deportiva':'Estado de mis planificaciones')+'</h2><p class="muted">El estado de revisión interna es independiente de la publicación pública. Solo la directiva puede aprobar y publicar.</p>'+ps.map(p=>'<div class="line row"><div><b>'+esc(p.title)+'</b><br><small>'+esc(teamName(p.team_id))+' · '+esc(reviewStatus(p.id))+'</small></div><button class="openFiles" data-id="'+p.id+'">Abrir expediente</button></div>').join('')+'<div id="planTools" class="muted"></div></section>'}
function academyView(){return '<section class="card"><h2>Formación del cuerpo técnico</h2><p>Cursos, competencias y evidencias de certificación.</p><a class="btn primary" href="../mi_formacion.html">Mis certificados</a> <a class="btn" href="formacion.html">Planes y asignaciones</a><p class="muted">Se mantienen por separado los expedientes de protección DS22 y los antecedentes médicos de jugadores.</p></section>'}
function wire(){document.querySelectorAll('.openFiles').forEach(b=>b.addEventListener('click',()=>openTools(b.dataset.id)))}
async function openTools(id){const p=app.plans.find(x=>x.id===id);if(!p)return;const files=app.files.filter(f=>f.plan_id===id),events=app.reviews.filter(e=>e.plan_id===id).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));const box=$('planTools');if(!box)return;box.innerHTML='<h3>'+esc(p.title)+'</h3><p>Estado: <b>'+esc(reviewStatus(id))+'</b></p><div class="line"><b>Archivos privados (PDF / Word)</b>'+files.map(f=>'<div class="line row"><span>'+esc(f.file_name)+' <small>'+date(f.created_at)+'</small></span><button class="download" data-path="'+esc(f.storage_path)+'">Abrir</button></div>').join('')+(files.length?'':'<p class="muted">Sin archivos adjuntos.</p>')+'<div class="form"><label>Nuevo archivo (máximo 10 MB)<input type="file" id="newFile" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><button class="primary" id="upload">Subir documento</button></div></div><div class="line"><b>Historial de revisión</b>'+events.map(e=>'<p><span class="tag">'+esc(e.action)+'</span> '+esc(e.comment||'')+' <small>'+date(e.created_at)+'</small></p>').join('')+(events.length?'':'<p class="muted">Sin movimientos de revisión.</p>')+'</div><div class="form"><label>Comentario (obligatorio al solicitar cambios)<textarea id="reviewComment" maxlength="1200"></textarea></label><button id="submitPlan">Enviar a revisión</button>'+(admin()?'<button id="approvePlan" class="primary">Aprobar internamente</button> <button id="requestChanges">Solicitar cambios</button>':'')+'</div>';
box.querySelectorAll('.download').forEach(b=>b.onclick=async()=>{const r=await app.db.storage.from('sport-plans-private').createSignedUrl(b.dataset.path,60);if(r.error){notice(r.error.message,true);return}window.open(r.data.signedUrl,'_blank','noopener')});
$('upload').onclick=()=>uploadFile(id);
$('submitPlan').onclick=()=>reviewPlan(id,'submitted');
if(admin()){$('approvePlan').onclick=()=>reviewPlan(id,'approved');$('requestChanges').onclick=()=>reviewPlan(id,'changes_requested')}
box.scrollIntoView({block:'nearest',behavior:'smooth'});
}
async function uploadFile(planId){const f=$('newFile')?.files?.[0];if(!f)return notice('Selecciona un archivo PDF o DOCX.',true);const types={'application/pdf':'pdf','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx'};const extension=f.name.split('.').pop().toLowerCase(),mime=extension==='pdf'?'application/pdf':extension==='docx'?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':null;if(!mime||!(f.type===mime||f.type===''))return notice('Solo se aceptan archivos PDF o DOCX.',true);if(f.size>10485760||!f.size)return notice('El documento debe tener entre 1 byte y 10 MB.',true);const path=planId+'/'+crypto.randomUUID().replace(/-/g,'')+'.'+extension;const client=app.db;const upload=await client.storage.from('sport-plans-private').upload(path,f,{contentType:mime,upsert:false});if(upload.error)return notice('No se pudo subir el archivo: '+upload.error.message,true);const result=await client.from('sport_plan_files').insert({plan_id:planId,storage_path:path,file_name:f.name.slice(0,255),mime_type:mime,byte_size:f.size,uploaded_by:app.profile.user_id}).select().single();if(result.error){await client.storage.from('sport-plans-private').remove([path]);return notice('No se pudo registrar el documento: '+result.error.message,true)}app.files.push(result.data);notice('Documento guardado en almacenamiento privado.');openTools(planId)}
async function reviewPlan(id,action){const comment=$('reviewComment')?.value?.trim()||'';if(action==='changes_requested'&&!comment)return notice('Escribe qué debe corregir el entrenador.',true);const resp=await app.db.from('sport_plan_review_events').insert({plan_id:id,action,comment:comment||null,author_id:app.profile.user_id}).select().single();if(resp.error)return notice('No se pudo registrar la revisión: '+resp.error.message,true);app.reviews.push(resp.data);notice('Movimiento registrado en el historial.');render();app.tab='revision';render();openTools(id)}
async function start(){if(!window.supabase)return notice('Error al cargar la biblioteca de acceso.',true);const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY,{auth:{storage:GIGANTES_AUTH_STORAGE,persistSession:true,autoRefreshToken:true}});app.db=sb;const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace('login.html?next=centro-tecnico.html');return}const q=await sb.from('profiles').select('user_id,display_name,role,active').eq('user_id',session.user.id).maybeSingle();if(q.error||!q.data?.active||!['superadmin','board','coach'].includes(q.data.role)){location.replace('../mi_gigantes.html');return}app.profile=q.data;$('ident').textContent=(q.data.display_name||session.user.email)+' · '+(admin()?'Directiva / Dirección':'Entrenador');const [t,a]=await Promise.all([sb.from('sport_teams').select('*').neq('status','inactive').order('sort_order'),sb.from('sport_staff_assignments').select('*').eq('active',true)]);if(t.error||a.error)return notice('No se pudieron cargar categorías y permisos.',true);app.assign=a.data||[];const now=new Date().toISOString().slice(0,10),ids=new Set(app.assign.filter(x=>x.user_id===q.data.user_id&&(!x.ends_on||x.ends_on>=now)).map(x=>x.team_id));app.teams=admin()?t.data||[]:(t.data||[]).filter(x=>ids.has(x.id)||ids.has(null));if(!app.teams.length){$('view').innerHTML='<div class="notice">La cuenta aún no tiene una categoría asignada. Solicita su activación a la directiva desde Formación → Asignaciones.</div>';return} $('team').innerHTML='<option value="all">Todas mis categorías</option>'+app.teams.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
const allowed=app.teams.map(x=>x.id);const res=await Promise.all([sb.from('sport_plans').select('id,team_id,title,period_type,status,public_visible').in('team_id',allowed),sb.from('sport_training_sessions').select('id,team_id,title,session_date,status').in('team_id',allowed),sb.from('sport_team_members').select('id,team_id,active').in('team_id',allowed),sb.from('sport_plan_files').select('*').order('created_at',{ascending:false}),sb.from('sport_plan_review_events').select('*').order('created_at',{ascending:false})]);if(res.some(x=>x.error))notice('Algunos datos no se pudieron cargar; verifica permisos en Control Center.',true);[app.plans,app.sessions,app.members,app.files,app.reviews]=res.map(x=>x.data||[]);const idsSession=app.sessions.map(x=>x.id);if(idsSession.length){const at=await sb.from('sport_session_attendance').select('session_id,attendance_status').in('session_id',idsSession);app.attendance=at.data||[]}render();}
$('team').onchange=e=>{app.selected=e.target.value;render()};$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;app.tab=b.dataset.tab;render()};start().catch(e=>notice('Error al abrir el panel: '+e.message,true));
</script></body></html>
