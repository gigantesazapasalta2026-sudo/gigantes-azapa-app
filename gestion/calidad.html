<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calidad de datos · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1100px;margin:auto}.top h1{margin:0;font-size:22px}.top a{color:#f6a16f;text-decoration:none}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.k{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px}.k b{display:block;font-size:28px}.k span{font-size:11px;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}.row{padding:10px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e}.high{background:#fee2e2;color:#991b1b}.meta{font-size:12px;color:var(--m)}.hide{display:none}@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Calidad de datos</h1><a href="index.html">← Control Center</a></div></header><main>
<div id="loading">Verificando acceso…</div><section id="app" class="hide"><div class="kpis"><div class="k"><b id="peopleK">0</b><span>Personas</span></div><div class="k"><b id="missingRutK">0</b><span>Sin RUT/ID</span></div><div class="k"><b id="fedK">0</b><span>Con Chile Rugby</span></div><div class="k"><b id="issuesK">0</b><span>Observaciones abiertas</span></div></div>
<div class="card"><h2>Registros incompletos</h2><div id="missing"></div></div><div class="card"><h2>Observaciones de conciliación</h2><div id="issues"></div></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=calidad.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p||!p.active||!['superadmin','board','coach','commission'].includes(p.role)){loading.textContent='No tienes permisos para este módulo.';return}
const [{data:people},{data:fed},{data:dq}]=await Promise.all([sb.from('people').select('id,full_name,rut_passport,birth_date,category,source'),sb.from('federation_status').select('person_id'),sb.from('data_quality_issues').select('*').eq('resolved',false).order('severity',{ascending:false})]);
peopleK.textContent=(people||[]).length;fedK.textContent=(fed||[]).length;const mr=(people||[]).filter(x=>!x.rut_passport);missingRutK.textContent=mr.length;issuesK.textContent=(dq||[]).length;
missing.innerHTML=mr.length?mr.map(x=>'<div class="row"><b>'+x.full_name+'</b><div class="meta">'+[x.category,x.birth_date,x.source].filter(Boolean).join(' · ')+'</div></div>').join(''):'<div class="meta">No hay jugadores sin RUT/ID.</div>';
issues.innerHTML=(dq||[]).length?(dq||[]).map(x=>'<div class="row"><span class="badge '+(x.severity==='high'?'high':'')+'">'+x.severity+'</span> <b>'+x.issue_type+'</b><div>'+x.description+'</div><div class="meta">'+[x.source_a,x.source_b].filter(Boolean).join(' ↔ ')+'</div></div>').join(''):'<div class="meta">Sin observaciones abiertas.</div>';loading.classList.add('hide');app.classList.remove('hide')})();
</script></body></html>
