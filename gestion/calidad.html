<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calidad de datos · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1100px;margin:auto}.top h1{margin:0;font-size:22px}.top a{color:#f6a16f;text-decoration:none}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.k{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px}.k b{display:block;font-size:28px}.k span{font-size:11px;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}.row{padding:10px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e}.high{background:#fee2e2;color:#991b1b}.meta{font-size:12px;color:var(--m)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.filters button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;cursor:pointer}.filters button.active{background:#111827;color:#fff}.resolve{margin-top:7px;border:0;border-radius:7px;background:#166534;color:#fff;padding:7px 9px;font-size:10px;font-weight:900;cursor:pointer}.hide{display:none}@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Calidad de datos</h1><a href="index.html">← Control Center</a></div></header><main>
<div id="loading">Verificando acceso…</div><section id="app" class="hide"><div class="kpis"><div class="k"><b id="peopleK">0</b><span>Personas</span></div><div class="k"><b id="missingRutK">0</b><span>Sin RUT/ID</span></div><div class="k"><b id="fedK">0</b><span>Con Chile Rugby</span></div><div class="k"><b id="issuesK">0</b><span>Observaciones abiertas</span></div></div>
<div class="card"><h2>Registros incompletos</h2><div id="missing"></div></div><div class="card"><h2>Observaciones de conciliación</h2><div class="filters"><button class="active" data-f="all">Todas</button><button data-f="high">Alta prioridad</button><button data-f="missing_health_system">Sistema de salud</button><button data-f="missing_rut">RUT/ID</button><button data-f="duplicate_federation">Duplicados Chile Rugby</button><button data-f="possible_family_relationship">Relación familiar</button><button data-f="rut_format">Formato RUT</button></div><div id="issues"></div></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let issueRows=[],peopleRows=[],activeIds=new Set(),profile=null,currentFilter='all';
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=calidad.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();profile=p;if(!p||!p.active||!['superadmin','board','coach','commission'].includes(p.role)){loading.textContent='No tienes permisos para este módulo.';return}
const [{data:people},{data:fed},{data:dq},{data:memberships}]=await Promise.all([sb.from('people').select('id,full_name,rut_passport,birth_date,category,source,health_system'),sb.from('federation_status').select('person_id'),sb.from('data_quality_issues').select('*').eq('resolved',false).order('severity',{ascending:false}),sb.from('memberships').select('person_id,status').eq('status','active')]);
activeIds=new Set((memberships||[]).map(x=>x.person_id));peopleRows=people||[];peopleK.textContent=peopleRows.length;fedK.textContent=(fed||[]).length;issueRows=dq||[];renderMissing();issuesK.textContent=issueRows.length;
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.f;renderIssues()});renderIssues();loading.classList.add('hide');app.classList.remove('hide')})();
function renderIssues(){let rows=issueRows;if(currentFilter==='high')rows=rows.filter(x=>x.severity==='high');else if(currentFilter!=='all')rows=rows.filter(x=>x.issue_type===currentFilter);issues.innerHTML=rows.length?rows.map(x=>{const person=/^[0-9a-f-]{36}$/i.test(x.entity_key||'')?peopleRows.find(p=>p.id===x.entity_key):null,canEdit=(profile?.role==='superadmin'||profile?.role==='board'),quick=canEdit&&person&&['missing_rut','missing_health_system'].includes(x.issue_type)?'<button class="resolve" style="background:#f36b21" onclick="completeField(\''+person.id+'\',\''+x.issue_type+'\')">Completar dato</button>':'';return '<div class="row"><span class="badge '+(x.severity==='high'?'high':'')+'">'+esc(x.severity)+'</span> <b>'+esc(x.issue_type)+'</b>'+(person?'<div><strong>'+esc(person.full_name)+'</strong></div>':'')+'<div>'+esc(x.description)+'</div><div class="meta">'+esc([x.source_a,x.source_b].filter(Boolean).join(' ↔ '))+'</div><div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">'+(x.source_url_a?'<a class="resolve" style="text-decoration:none;background:#1d4ed8" target="_blank" rel="noopener" href="'+esc(x.source_url_a)+'">Fuente A</a>':'')+(x.source_url_b?'<a class="resolve" style="text-decoration:none;background:#475569" target="_blank" rel="noopener" href="'+esc(x.source_url_b)+'">Fuente B</a>':'')+quick+(canEdit?'<button class="resolve" onclick="resolveIssue(\''+x.id+'\')">Resolver observación</button>':'')+'</div></div>'}).join(''):'<div class="meta">Sin observaciones abiertas en este filtro.</div>'}
function renderMissing(){
 const players=peopleRows.filter(x=>activeIds.has(x.id)),mr=players.filter(x=>!String(x.rut_passport||'').trim());missingRutK.textContent=mr.length;
 missing.innerHTML=mr.length?mr.map(x=>'<div class="row"><b>'+esc(x.full_name)+'</b><div class="meta">'+esc([x.category,x.birth_date,x.source].filter(Boolean).join(' · '))+'</div>'+((profile?.role==='superadmin'||profile?.role==='board')?'<button class="resolve" style="background:#f36b21" onclick="completeField(\''+x.id+'\',\'missing_rut\')">Completar RUT/ID</button>':'')+'</div>').join(''):'<div class="meta">No hay jugadores activos sin RUT/ID.</div>';
}
async function completeField(personId,type){
 const p=peopleRows.find(x=>x.id===personId);if(!p)return;
 const label=type==='missing_rut'?'RUT o documento de identidad':'sistema de salud / previsión';
 const current=type==='missing_rut'?(p.rut_passport||''):(p.health_system||'');
 const value=prompt((p.full_name||'Jugador')+'\nIngresa '+label+':',current);
 if(value===null||!value.trim())return;
 if(!confirm('¿Guardar este dato en el Registro Maestro?'))return;
 const patch=type==='missing_rut'?{rut_passport:value.trim(),updated_at:new Date().toISOString()}:{health_system:value.trim(),updated_at:new Date().toISOString()};
 const {error}=await sb.from('people').update(patch).eq('id',personId);if(error)return alert(error.message);
 await reloadQuality();
}
async function reloadQuality(){
 const [pr,dq]=await Promise.all([sb.from('people').select('id,full_name,rut_passport,birth_date,category,source,health_system'),sb.from('data_quality_issues').select('*').eq('resolved',false).order('severity',{ascending:false})]);
 if(pr.error||dq.error)return alert((pr.error||dq.error).message);
 peopleRows=pr.data||[];issueRows=dq.data||[];peopleK.textContent=peopleRows.length;issuesK.textContent=issueRows.length;renderMissing();renderIssues();
}
async function resolveIssue(id){const note=prompt('Nota de resolución o verificación:');if(!note?.trim())return;const {error}=await sb.from('data_quality_issues').update({resolved:true,resolved_at:new Date().toISOString(),resolution_notes:note.trim()}).eq('id',id).eq('resolved',false);if(error)return alert(error.message);issueRows=issueRows.filter(x=>x.id!==id);issuesK.textContent=issueRows.length;renderIssues()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
