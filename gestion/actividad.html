<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0f14"><title>Actividad reciente · Gigantes Control Center</title>
<style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1100px;margin:auto}.topin{display:flex;gap:12px;align-items:center}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;color:#f7a472;font-size:11px}.top a{margin-left:auto;color:#fff;text-decoration:none;font-weight:900}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:14px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{padding:9px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.row{display:grid;grid-template-columns:150px 1fr 180px;gap:12px;padding:12px 0;border-top:1px solid #eef0f2}.row:first-child{border-top:0}.row b{display:block;font-size:13px}.meta{font-size:11px;color:var(--m);line-height:1.45}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3f4f6;font-size:10px;font-weight:900}.badge.void{background:#fee2e2;color:#991b1b}.badge.review,.badge.status_change{background:#dbeafe;color:#1d4ed8}.badge.insert{background:#dcfce7;color:#166534}.empty{color:var(--m);font-size:12px}.hide{display:none}@media(max-width:720px){.row{grid-template-columns:1fr}.topin{align-items:flex-start;flex-wrap:wrap}.top a{margin-left:0}}</style><link rel="stylesheet" href="ux.css?v=20261005"></head><body>
<header class="top"><div class="in topin"><div><h1>🕘 Actividad reciente</h1><p>Auditoría operativa del Control Center</p></div><a href="index.html">← Control Center</a></div></header>
<main><div id="loading" class="card">Verificando acceso…</div><section id="app" class="hide"><div class="card"><b id="count">0</b> cambios registrados desde la activación del historial central. <span class="meta">Solo Directiva y administración general pueden ver esta pantalla.</span></div>
<div class="card"><div class="filters"><select id="type"><option value="">Todas las áreas</option><option value="task">Tareas</option><option value="sponsor_prospect">Sponsors</option><option value="payment_submission">Comprobantes</option><option value="membership_payment">Pagos de cuotas</option><option value="treasury_transaction">Tesorería</option><option value="profile">Roles</option><option value="access_invitation">Invitaciones</option><option value="event">Eventos</option><option value="travel_participant">Gira Santiago</option></select><input id="q" type="search" placeholder="Buscar texto…" autocomplete="off"></div><div id="list"></div></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.GIGANTES_AUTH_STORAGE,persistSession:true,autoRefreshToken:true}});let rows=[],profiles=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={task:'Tarea',sponsor_prospect:'Sponsor',payment_submission:'Comprobante',membership_payment:'Pago cuota',treasury_transaction:'Tesorería',profile:'Perfil',access_invitation:'Invitación',event:'Evento',travel_participant:'Gira Santiago'};
const actions={insert:'Creado',update:'Actualizado',review:'Revisado',void:'Anulado',status_change:'Cambio de estado',access_change:'Cambio de acceso'};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=actividad.html';return}const p=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p.data?.active||!['superadmin','board'].includes(p.data.role)){loading.textContent='Este historial está reservado a Directiva y administración general.';return}
 const [a,pr]=await Promise.all([sb.from('control_activity_log').select('*').order('occurred_at',{ascending:false}).limit(500),sb.from('profiles').select('user_id,display_name')]);if(a.error){loading.textContent='No se pudo cargar la actividad.';return}rows=a.data||[];profiles=new Map((pr.data||[]).map(x=>[x.user_id,x.display_name||'Usuario']));loading.classList.add('hide');app.classList.remove('hide');render()})();
function render(){const t=type.value,s=q.value.trim().toLowerCase();const data=rows.filter(x=>(!t||x.entity_type===t)&&(!s||[x.summary,x.state,profiles.get(x.actor_user_id),labels[x.entity_type],actions[x.action]].join(' ').toLowerCase().includes(s)));count.textContent=data.length;list.innerHTML=data.length?data.map(x=>'<div class="row"><div><span class="badge '+esc(x.action)+'">'+esc(actions[x.action]||x.action)+'</span><div class="meta">'+esc(labels[x.entity_type]||x.entity_type)+'</div></div><div><b>'+esc(x.summary||'Registro')+'</b><div class="meta">'+(x.state?'Estado: '+esc(x.state)+' · ':'')+new Date(x.occurred_at).toLocaleString('es-CL')+'</div></div><div class="meta">'+esc(profiles.get(x.actor_user_id)||'Sistema')+'</div></div>').join(''):'<div class="empty">No hay actividad que coincida con este filtro.</div>'}
type.onchange=render;q.oninput=render;
</script><script src="ux.js?v=20261005"></script><script>window.addEventListener('load',()=>{if(window.GigantesUX){GigantesUX.addTools({target:'main',title:"Actividad reciente"});GigantesUX.help({title:"Actividad reciente",text:"Revisa qué cambios se han realizado en el sistema.",steps:['Empieza por los pendientes visibles.','Actualiza la información dentro de la app.','Usa Imprimir para reuniones o respaldo.']})}});</script></body></html>
