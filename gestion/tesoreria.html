<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesorería · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085;--ok:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1100px;margin:auto}.top h1{margin:0;font-size:22px}.top a{color:#f6a16f;text-decoration:none}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.k{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px}.k b{display:block;font-size:28px}.k span{font-size:11px;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:11px;font-weight:900;display:block;margin-bottom:4px}input{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:8px;background:var(--o);color:#fff;padding:10px 12px;font-weight:900;cursor:pointer}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.row{padding:12px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.meta{font-size:12px;color:var(--m)}.hide{display:none}@media(max-width:720px){.kpis,.grid{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Tesorería</h1><a href="index.html">← Control Center</a></div></header><main><div id="loading">Verificando acceso…</div><section id="app" class="hide">
<div class="kpis"><div class="k"><b id="activeK">0</b><span>Jugadores activos</span></div><div class="k"><b id="pendingK">0</b><span>Comprobantes por revisar</span></div><div class="k"><b id="debtK">$0</b><span>Deuda registrada</span></div></div>
<div class="card"><h2>Generar cuota mensual</h2><div class="grid"><div><label>Mes</label><input id="period" type="month"></div><div><label>Monto por jugador</label><input id="amount" type="number" min="0" placeholder="Monto CLP"></div><div><label>Fecha de vencimiento</label><input id="due" type="date"></div></div><p class="meta">La cuota se genera sólo una vez por jugador y mes. Si ya existe, no se duplica.</p><button id="generate" class="btn">Generar cuotas</button><span id="genMsg" class="meta"></span></div>
<div class="card"><h2>Comprobantes pendientes</h2><div id="submissions"></div></div>
<div class="card"><h2>Cuotas pendientes / vencidas</h2><div id="charges"></div></div>
</section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let people=[];
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=tesoreria.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p||!p.active||!['superadmin','board','treasury'].includes(p.role)){loading.textContent='Este módulo requiere permisos de Directiva o Tesorería.';return}loading.classList.add('hide');app.classList.remove('hide');const now=new Date(),ym=now.toISOString().slice(0,7);period.value=ym;due.value=ym+'-10';await refresh()})();
async function refresh(){const [pr,cr,sr]=await Promise.all([sb.from('people').select('id,full_name,category').eq('member_status','active').order('full_name'),sb.from('membership_charges').select('id,person_id,period,amount,due_date,status').in('status',['pending','submitted','overdue']).order('due_date'),sb.from('payment_submissions').select('id,person_id,charge_id,amount,transfer_date,storage_path,status').eq('status','pending_review').order('submitted_at')]);people=pr.data||[];const cs=cr.data||[],ss=sr.data||[];activeK.textContent=people.length;pendingK.textContent=ss.length;debtK.textContent='$'+cs.reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString('es-CL');const map=Object.fromEntries(people.map(x=>[x.id,x]));
submissions.innerHTML=ss.length?(await Promise.all(ss.map(async x=>{let link='#';if(x.storage_path){const {data}=await sb.storage.from('member-private').createSignedUrl(x.storage_path,600);if(data?.signedUrl)link=data.signedUrl}return '<div class="row"><b>'+(map[x.person_id]?.full_name||'Jugador')+'</b> · $'+Number(x.amount).toLocaleString('es-CL')+'<div class="meta">Transferencia '+x.transfer_date+'</div><a class="meta" target="_blank" href="'+link+'">Ver comprobante</a> <button class="btn ok" onclick="review(\''+x.id+'\',\''+x.charge_id+'\',true)">Aprobar</button> <button class="btn bad" onclick="review(\''+x.id+'\',\''+x.charge_id+'\',false)">Rechazar</button></div>'}))).join(''):'<div class="meta">No hay comprobantes pendientes.</div>';
charges.innerHTML=cs.length?cs.slice(0,100).map(x=>'<div class="row"><b>'+(map[x.person_id]?.full_name||'Jugador')+'</b> · $'+Number(x.amount).toLocaleString('es-CL')+'<div class="meta">'+x.period.slice(0,7)+' · vence '+x.due_date+' · '+x.status+'</div></div>').join(''):'<div class="meta">No hay cuotas pendientes.</div>'}
generate.onclick=async()=>{if(!period.value||!amount.value||!due.value){genMsg.textContent=' Completa mes, monto y vencimiento.';return}genMsg.textContent=' Generando…';const rows=people.map(p=>({person_id:p.id,period:period.value+'-01',amount:Number(amount.value),due_date:due.value,status:'pending'}));const {error}=await sb.from('membership_charges').upsert(rows,{onConflict:'person_id,period',ignoreDuplicates:true});genMsg.textContent=error?' Error: '+error.message:' Cuotas generadas sin duplicados.';if(!error)refresh()}
async function review(id,chargeId,ok){let q=await sb.from('payment_submissions').update({status:ok?'approved':'rejected',reviewed_at:new Date().toISOString()}).eq('id',id);if(q.error){alert(q.error.message);return}if(ok&&chargeId){q=await sb.from('membership_charges').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',chargeId);if(q.error){alert(q.error.message);return}}refresh()}
</script></body></html>
