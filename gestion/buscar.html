<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Buscar · Gigantes Control Center</title>
<style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1150px;margin:auto}.topin{display:flex;align-items:center;gap:12px}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;color:#cbd5e1;font-size:11px}.top a{margin-left:auto;color:#f6a16f;text-decoration:none;font-weight:900}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:18px 0}.search input{padding:14px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;font-size:15px}.search button{border:0;border-radius:10px;background:var(--o);color:#fff;padding:0 18px;font-weight:900;cursor:pointer}.summary{font-size:12px;color:var(--m);margin-bottom:12px}.group{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px;margin:12px 0}.group h2{font-size:15px;margin:0 0 8px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #eef0f2}.item:first-of-type{border-top:0}.item b{font-size:13px}.meta{font-size:11px;color:var(--m);margin-top:3px;line-height:1.4}.item a{border:1px solid var(--l);border-radius:8px;padding:7px 9px;color:#111827;text-decoration:none;font-size:10px;font-weight:900}.empty,.notice{background:#fff;border:1px solid var(--l);border-radius:12px;padding:16px;font-size:12px;color:var(--m)}.hide{display:none}@media(max-width:650px){.topin{align-items:flex-start;flex-wrap:wrap}.top a{margin-left:0}.search{grid-template-columns:1fr}.search button{padding:12px}.item{grid-template-columns:1fr}.item a{justify-self:start}}
</style></head><body>
<header class="top"><div class="in topin"><div><h1>🔎 Buscador global</h1><p>Personas, proyectos, tareas, documentos y recaudación</p></div><a href="index.html">← Control Center</a></div></header>
<main><div id="loading" class="notice">Verificando acceso…</div><section id="app" class="hide">
<form id="searchForm" class="search"><input id="q" autocomplete="off" maxlength="80" placeholder="Ej.: Copa FUFY, Santiago, Patricia, seguro…" autofocus><button>Buscar</button></form>
<div id="summary" class="summary">Escribe al menos 2 caracteres.</div><div id="results"></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.GIGANTES_AUTH_STORAGE,persistSession:true,autoRefreshToken:true}});let profile=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=buscar.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();profile=p;if(!p?.active||!['superadmin','board','treasury','coach','commission'].includes(p.role)){loading.textContent='No tienes acceso al Control Center.';return}loading.classList.add('hide');app.classList.remove('hide');const initial=new URLSearchParams(location.search).get('q')||'';q.value=initial;if(initial.trim().length>=2)searchAll(initial.trim())})();
searchForm.onsubmit=e=>{e.preventDefault();const term=q.value.trim();history.replaceState(null,'',term?('?q='+encodeURIComponent(term)):'buscar.html');searchAll(term)};
async function searchAll(term){if(term.length<2){summary.textContent='Escribe al menos 2 caracteres.';results.replaceChildren();return}summary.textContent='Buscando…';results.replaceChildren();const pattern='%'+term.replace(/[%_,()]/g,' ')+'%';
 const jobs=[
  ['Personas',sb.from('people').select('id,full_name,category,member_status,email').ilike('full_name',pattern).limit(25),'index.html','full_name',x=>(x.category||'')+' · '+(x.member_status||'')],
  ['Proyectos',sb.from('projects').select('id,code,name,status,owner_name').ilike('name',pattern).limit(25),'proyectos.html','name',x=>(x.code||'')+' · '+(x.status||'')+' · '+(x.owner_name||'')],
  ['Tareas',sb.from('tasks').select('id,title,status,owner_name,due_date').ilike('title',pattern).limit(40),'index.html','title',x=>(x.status||'')+' · '+(x.owner_name||'Sin responsable')+(x.due_date?' · vence '+x.due_date:'')],
  ['Documentos',sb.from('control_document_catalog').select('id,title,category,current_version,source_status').ilike('title',pattern).is('deleted_at',null).limit(30),'biblioteca.html','title',x=>(x.category||'')+' · v'+(x.current_version||1)+' · '+(x.source_status||'')],
  ['Recaudación',sb.from('fundraising_activities').select('id,title,activity_type,status,event_date').ilike('title',pattern).limit(25),'recaudacion.html','title',x=>(x.event_date||'Sin fecha')+' · '+(x.activity_type||'')+' · '+(x.status||'')],
  ['Documentos institucionales',sb.from('club_documents').select('id,title,status,doc_code').ilike('title',pattern).limit(25),'index.html','title',x=>(x.doc_code||'')+' · '+(x.status||'')]
 ];
 const settled=await Promise.all(jobs.map(async j=>{const r=await j[1];return {...{label:j[0],href:j[2],titleKey:j[3],meta:j[4]},data:r.data||[],error:r.error}}));
 let total=0;for(const g of settled){if(g.error)continue;total+=g.data.length;if(!g.data.length)continue;const sec=document.createElement('section');sec.className='group';const h=document.createElement('h2');h.textContent=g.label+' · '+g.data.length;sec.append(h);for(const x of g.data){const row=document.createElement('div');row.className='item';row.innerHTML='<div><b>'+esc(x[g.titleKey])+'</b><div class="meta">'+esc(g.meta(x))+'</div></div><a href="'+g.href+'">Abrir módulo</a>';sec.append(row)}results.append(sec)}
 summary.textContent=total?total+' resultados visibles según tus permisos.':'Sin resultados para “'+term+'”.';if(!total)results.innerHTML='<div class="empty">Prueba con otro nombre, proyecto o documento.</div>';
}
</script></body></html>
