<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos · Gestión Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085;--ok:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1100px;margin:auto}.top h1{margin:0}.top a{color:#f6a16f;text-decoration:none}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-size:11px;font-weight:900;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:8px;background:var(--o);color:#fff;padding:10px 12px;font-weight:900;cursor:pointer}.btn.ok{background:var(--ok)}.row{padding:12px 0;border-top:1px solid #eee}.meta{font-size:12px;color:var(--m)}.hide{display:none}.attendance{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Eventos y asistencia</h1><a href="index.html">← Control Center</a></div></header><main><div id="loading">Verificando acceso…</div><section id="app" class="hide">
<div class="card"><h2>Crear evento</h2><div class="grid"><div><label>Título</label><input id="title"></div><div><label>Tipo</label><select id="type"><option value="training">Entrenamiento</option><option value="match">Partido</option><option value="meeting">Reunión</option><option value="activity">Actividad</option><option value="fundraising">Recaudación / Bingo / Venta</option><option value="tour">Gira/Viaje</option></select></div><div><label>Inicio</label><input id="start" type="datetime-local"></div><div><label>Fin</label><input id="end" type="datetime-local"></div><div><label>Lugar</label><input id="place"></div><div><label>Categoría/equipo</label><select id="team"><option value="">Todo el club</option></select></div><div><label>Repetir semanalmente</label><select id="repeat"><option value="1">No repetir</option><option value="4">4 semanas</option><option value="8">8 semanas</option><option value="12">12 semanas</option></select></div><div><label>Cupos (opcional)</label><input id="capacity" type="number" min="1" placeholder="Sin límite"></div></div><label style="margin-top:10px"><input id="publicVisible" type="checkbox" style="width:auto" checked> Mostrar este evento públicamente en la web del club</label><label style="margin-top:10px">Notas</label><textarea id="notes"></textarea><button id="create" class="btn">Crear evento</button><span id="msg" class="meta"></span></div>
<div class="card"><h2>Próximos eventos</h2><div id="events"></div></div>
<div id="attendanceCard" class="card hide"><h2 id="eventName">Asistencia</h2><div id="stats" class="meta"></div><div id="attendance"></div></div>
</section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.GIGANTES_AUTH_STORAGE,persistSession:true,autoRefreshToken:true}});let teams=[],people=[],memberships=[],eventRows=[],currentEvent=null,me;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=eventos.html';return}const r=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();me=r.data;if(!me||!me.active||!['superadmin','board','coach','commission'].includes(me.role)){loading.textContent='No tienes permisos para gestionar eventos.';return}const [tr,pr,mr]=await Promise.all([sb.from('teams').select('id,name,category').eq('active',true),sb.from('people').select('id,full_name,category').eq('member_status','active').order('full_name'),sb.from('memberships').select('person_id,team_id,status').eq('status','active')]);teams=tr.data||[];people=pr.data||[];memberships=mr.data||[];team.innerHTML='<option value="">Todo el club</option>'+teams.map(x=>'<option value="'+x.id+'">'+x.name+(x.category?' · '+x.category:'')+'</option>').join('');loading.classList.add('hide');app.classList.remove('hide');refresh()})();
create.onclick=async()=>{if(!title.value.trim()||!start.value){msg.textContent='Completa título e inicio.';return}const {data:{user}}=await sb.auth.getUser();const baseStart=new Date(start.value),baseEnd=end.value?new Date(end.value):null,count=Number(repeat.value||1),series=count>1?crypto.randomUUID():null,rows=[];for(let i=0;i<count;i++){const s=new Date(baseStart.getTime()+i*7*86400000),e=baseEnd?new Date(baseEnd.getTime()+i*7*86400000):null;rows.push({title:title.value.trim(),event_type:type.value,starts_at:s.toISOString(),ends_at:e?e.toISOString():null,location_name:place.value.trim()||null,team_id:team.value||null,notes:notes.value.trim()||null,created_by:user.id,series_id:series,capacity:capacity.value?Number(capacity.value):null,waitlist_enabled:true,public_visible:publicVisible.checked})}const {error}=await sb.from('events').insert(rows);msg.textContent=error?'Error: '+error.message:(Number(repeat.value||1)>1?'✅ Serie de eventos creada.':'✅ Evento creado.');if(!error){title.value=place.value=notes.value=capacity.value='';start.value=end.value='';refresh()}}
async function refresh(){const {data}=await sb.from('events').select('*').eq('active',true).gte('starts_at',new Date(Date.now()-86400000).toISOString()).order('starts_at');eventRows=data||[];events.innerHTML=eventRows.length?eventRows.map(x=>'<div class="row"><b>'+x.title+'</b><div class="meta">'+new Date(x.starts_at).toLocaleString('es-CL')+' · '+(x.location_name||'Lugar por definir')+' · '+(x.public_visible?'🌐 Público':'🔒 Interno')+'</div><button class="btn" onclick="openAttendance(\''+x.id+'\',\''+x.title.replace(/'/g,"")+'\')">Asistencia</button></div>').join(''):'<div class="meta">No hay próximos eventos.</div>'}
async function openAttendance(id,name){currentEvent=id;eventName.textContent='Asistencia · '+name;const ev=eventRows.find(x=>x.id===id);const eligibleIds=new Set(memberships.filter(m=>!ev?.team_id||m.team_id===ev.team_id).map(m=>m.person_id)),eligible=people.filter(p=>eligibleIds.has(p.id));const [rr,ar]=await Promise.all([sb.from('event_responses').select('*').eq('event_id',id),sb.from('attendance_records').select('*').eq('event_id',id)]);const resp=rr.data||[],att=ar.data||[],map=Object.fromEntries(att.map(x=>[x.person_id,x]));stats.textContent='Jugadores convocables: '+eligible.length+' · Confirmados: '+resp.filter(x=>x.response==='yes').length+' · No: '+resp.filter(x=>x.response==='no').length+' · Tal vez: '+resp.filter(x=>x.response==='maybe').length;attendance.innerHTML=eligible.map(p=>'<div class="row attendance"><div><b>'+p.full_name+'</b><div class="meta">'+(p.category||'')+'</div></div><select onchange="mark(\''+p.id+'\',this.value)"><option value="">—</option><option value="present" '+(map[p.id]?.status==='present'?'selected':'')+'>Presente</option><option value="late" '+(map[p.id]?.status==='late'?'selected':'')+'>Atrasado</option><option value="excused" '+(map[p.id]?.status==='excused'?'selected':'')+'>Justificado</option><option value="absent" '+(map[p.id]?.status==='absent'?'selected':'')+'>Ausente</option></select></div>').join('');attendanceCard.classList.remove('hide')}
async function mark(person,status){if(!status||!currentEvent)return;const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('attendance_records').upsert({event_id:currentEvent,person_id:person,status,marked_by:user.id,marked_at:new Date().toISOString()},{onConflict:'event_id,person_id'});if(error)alert(error.message)}
</script></body></html>
