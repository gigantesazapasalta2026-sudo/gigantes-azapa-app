<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de proyectos · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1100px;margin:auto}.top h1{margin:0;font-size:22px}.top a{color:#f6a16f;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px}.card h3{margin:0 0 8px}.meta{font-size:12px;color:var(--m);line-height:1.45}.btn{display:inline-block;background:var(--o);color:#fff;text-decoration:none;border:0;border-radius:8px;padding:9px 11px;font-weight:900;cursor:pointer}main{padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.hide{display:none}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div class="in"><h1>Gestión de proyectos y giras</h1><a href="index.html">← Control Center</a></div></header><main>
<div id="loading">Verificando acceso…</div><section id="app" class="hide"><div id="projects" class="grid"></div>
<div id="detail" class="panel hide"><h2 id="pname"></h2><p id="pmeta" class="meta"></p>
<div class="row"><div><h3>🎯 Nueva meta</h3><input id="gtitle" placeholder="Meta"><input id="gtarget" type="number" placeholder="Valor objetivo"><input id="gunit" placeholder="Unidad"><button class="btn" id="addGoal">Agregar meta</button></div>
<div><h3>📌 Nuevo hito</h3><input id="mtitle" placeholder="Hito"><input id="mdate" type="date"><input id="mowner" placeholder="Responsable"><button class="btn" id="addMilestone">Agregar hito</button></div>
<div><h3>📊 Resumen</h3><div id="summary" class="meta"></div></div></div>
<div class="row" style="margin-top:14px"><div><h3>Metas</h3><div id="goals"></div></div><div><h3>Hitos</h3><div id="milestones"></div></div><div><h3>Tareas</h3><div id="tasks"></div></div></div>
</div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let current=null;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=proyectos.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p||!p.active||!['superadmin','board','coach','commission','treasury'].includes(p.role)){loading.textContent='No tienes permisos para este módulo.';return}loading.classList.add('hide');app.classList.remove('hide');loadProjects()})();
async function loadProjects(){const {data}=await sb.from('projects').select('*').order('start_date',{ascending:false});projects.innerHTML=(data||[]).map(p=>'<div class="card"><h3>'+p.name+'</h3><div class="meta">'+[p.project_type,p.location,p.start_date,p.status].filter(Boolean).join(' · ')+'</div><p class="meta">'+(p.objective||'')+'</p><button class="btn" onclick="openP(\''+p.id+'\')">Gestionar</button></div>').join('')}
async function openP(id){current=id;const {data:p}=await sb.from('projects').select('*').eq('id',id).single();pname.textContent=p.name;pmeta.textContent=[p.location,p.start_date,p.end_date,p.status].filter(Boolean).join(' · ');detail.classList.remove('hide');await refresh()}
async function refresh(){const [{data:g},{data:m},{data:t},{data:f},{data:tr}]=await Promise.all([sb.from('project_goals').select('*').eq('project_id',current),sb.from('project_milestones').select('*').eq('project_id',current).order('due_date'),sb.from('tasks').select('*').eq('project_id',current).order('due_date'),sb.from('finance_entries').select('kind,amount').eq('project_id',current),sb.from('travel_participants').select('id').eq('project_id',current)]);goals.innerHTML=(g||[]).map(x=>'<p><b>'+x.title+'</b><br><span class="meta">'+(x.current_value||0)+' / '+(x.target_value||0)+' '+(x.unit||'')+'</span></p>').join('')||'<span class="meta">Sin metas</span>';milestones.innerHTML=(m||[]).map(x=>'<p><b>'+x.title+'</b><br><span class="meta">'+(x.due_date||'')+' · '+(x.progress||0)+'%</span></p>').join('')||'<span class="meta">Sin hitos</span>';tasks.innerHTML=(t||[]).slice(0,10).map(x=>'<p><b>'+x.title+'</b><br><span class="meta">'+(x.status||'')+' · '+(x.owner_name||'Sin responsable')+'</span></p>').join('')||'<span class="meta">Sin tareas</span>';let inc=(f||[]).filter(x=>x.kind==='income').reduce((a,x)=>a+Number(x.amount||0),0),exp=(f||[]).filter(x=>x.kind==='expense').reduce((a,x)=>a+Number(x.amount||0),0);summary.innerHTML='Participantes: <b>'+(tr||[]).length+'</b><br>Ingresos: <b>$'+inc.toLocaleString('es-CL')+'</b><br>Gastos: <b>$'+exp.toLocaleString('es-CL')+'</b><br>Saldo: <b>$'+(inc-exp).toLocaleString('es-CL')+'</b>'}
addGoal.onclick=async()=>{if(!current||!gtitle.value.trim())return;const r=await sb.from('project_goals').insert({project_id:current,goal_type:'general',title:gtitle.value.trim(),target_value:Number(gtarget.value||0),current_value:0,unit:gunit.value.trim()||null,status:'active'});if(r.error){alert(r.error.message);return}gtitle.value=gtarget.value=gunit.value='';refresh()}
addMilestone.onclick=async()=>{if(!current||!mtitle.value.trim())return;const r=await sb.from('project_milestones').insert({project_id:current,title:mtitle.value.trim(),due_date:mdate.value||null,status:'pending',progress:0,owner_name:mowner.value.trim()||null});if(r.error){alert(r.error.message);return}mtitle.value=mdate.value=mowner.value='';refresh()}
</script></body></html>
