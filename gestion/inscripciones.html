<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Incorporaciones · Gestión Gigantes</title>
<style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085;--ok:#166534;--warn:#92400e;--bad:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111827}.top{background:#0b0f14;color:#fff;padding:18px 20px}.in,main{max-width:1280px;margin:auto}.top h1{margin:0 0 4px}.top a{color:#f6a16f;text-decoration:none;font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric{background:#fff;border:1px solid var(--l);border-radius:13px;padding:15px}.metric b{font-size:1.7rem;display:block}.metric span{font-size:.75rem;color:var(--m)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}.toolbar button.active{background:#111827;color:#fff}.req{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.head h2{margin:0 0 4px;font-size:1.12rem}.meta{font-size:.75rem;color:var(--m);line-height:1.5}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:.68rem;font-weight:900;background:#f3f4f6}.status.ready,.status.approved{background:#dcfce7;color:#166534}.status.documents_pending{background:#fef3c7;color:#92400e}.status.rejected{background:#fee2e2;color:#991b1b}.cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-top:14px}.box{border:1px solid #e5e7eb;border-radius:12px;padding:13px}.box h3{font-size:.82rem;margin:0 0 8px}.line{font-size:.76rem;line-height:1.6}.docs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.doc{border:1px solid #e5e7eb;background:#fafafa;border-radius:9px;padding:9px;text-align:left;font-size:.72rem;font-weight:800;cursor:pointer}.doc.missing{color:#991b1b;background:#fef2f2;cursor:default}.checkrow{display:flex;gap:8px;align-items:flex-start;margin:9px 0;font-size:.76rem;line-height:1.35}.checkrow input{margin-top:2px}.passActions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:8px 10px;font-weight:900;cursor:pointer;font-size:.72rem}.ok{background:#166534;color:#fff}.bad{background:#991b1b;color:#fff}.neutral{background:#111827;color:#fff}.note{width:100%;min-height:60px;border:1px solid #d0d5dd;border-radius:8px;padding:8px;font:inherit;font-size:.75rem}.auto{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px;font-size:.73rem;line-height:1.45;margin-top:10px}.hide{display:none}@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}@media(max-width:520px){.summary{grid-template-columns:1fr}.docs{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Solicitudes de incorporación</h1><a href="index.html">← Control Center</a></div></header>
<main><div id="loading" class="req">Verificando acceso…</div><section id="app" class="hide">
<div class="summary"><div class="metric"><b id="mTotal">0</b><span>Total</span></div><div class="metric"><b id="mPending">0</b><span>Pendientes</span></div><div class="metric"><b id="mReady">0</b><span>Acceso habilitado</span></div><div class="metric"><b id="mApproved">0</b><span>Incorporados</span></div></div>
<div class="toolbar"><button class="active" data-filter="all">Todas</button><button data-filter="pending">Pendientes</button><button data-filter="documents_pending">Documentos pendientes</button><button data-filter="ready">Acceso listo</button><button data-filter="approved">Incorporados</button></div>
<div id="list"></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.GIGANTES_AUTH_STORAGE,persistSession:true,autoRefreshToken:true}});let rows=[],filter='all',session;
(async()=>{const s=await sb.auth.getSession();session=s.data.session;if(!session){location.href='login.html?next=inscripciones.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p||!p.active||!['superadmin','board'].includes(p.role)){loading.textContent='No tienes permisos para revisar incorporaciones.';return}loading.classList.add('hide');app.classList.remove('hide');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});await refresh()})();
async function refresh(){const {data,error}=await sb.from('registration_requests').select('*').order('created_at',{ascending:false}).limit(400);if(error){list.innerHTML='<div class="req">Error: '+esc(error.message)+'</div>';return}rows=data||[];mTotal.textContent=rows.length;mPending.textContent=rows.filter(x=>['pending','contacted','documents_pending'].includes(x.status)).length;mReady.textContent=rows.filter(x=>x.access_ready&&x.status!=='approved').length;mApproved.textContent=rows.filter(x=>x.status==='approved').length;render()}
function render(){const data=filter==='all'?rows:rows.filter(x=>x.status===filter);list.innerHTML=data.length?data.map(card).join(''):'<div class="req meta">No hay solicitudes en este estado.</div>'}
function card(x){const docs=[['Foto jugador',x.player_photo_storage_path],['Pago BD',x.federation_payment_storage_path],['Pantallazo BD',x.federation_incorporated_storage_path],['Pago seguro',x.insurance_proof_storage_path],['Pase club',x.previous_club?x.transfer_pass_storage_path:null,x.previous_club]];return '<article class="req"><div class="head"><div><h2>'+esc(x.player_name)+'</h2><div class="meta">'+esc(x.category||'Sin categoría')+' · '+esc(x.document_type||'')+' '+esc(x.document_number||'')+' · '+esc(x.guardian_email||'')+'<br>Solicitud '+new Date(x.created_at).toLocaleString('es-CL')+'</div></div><span class="status '+esc(x.status)+'">'+labelStatus(x.status)+'</span></div><div class="cols"><div class="box"><h3>Ficha</h3><div class="line"><b>Nacimiento:</b> '+esc(x.birth_date||'')+'<br><b>Dirección:</b> '+esc(x.address||'')+', '+esc(x.commune||'')+'<br><b>Apoderado/contacto:</b> '+esc(x.guardian_name||'')+' · '+esc(x.guardian_phone||'')+'<br><b>Emergencia:</b> '+esc(x.emergency_contact_name||'')+' · '+esc(x.emergency_contact_phone||'')+'<br><b>Salud:</b> '+esc(x.health_system||'')+' · '+esc(x.allergies_conditions||'Sin observaciones')+'<br><b>BD:</b> '+esc(x.federation_account_email||'')+'<br><b>Seguro ref.:</b> '+esc(x.insurance_reference||'—')+'<br><b>Club anterior:</b> '+esc(x.previous_club_name||'No aplica')+'</div></div><div class="box"><h3>Documentos privados</h3><div class="docs">'+docs.map(d=>docButton(d[0],d[1],d[2])).join('')+'</div></div><div class="box"><h3>Validación</h3><label class="checkrow"><input type="checkbox" '+(x.federation_verified?'checked':'')+' onchange="verify(\''+x.id+'\',\'federation_verified\',this.checked)"><span>BD Chile Rugby validada</span></label><label class="checkrow"><input type="checkbox" '+(x.insurance_verified?'checked':'')+' onchange="verify(\''+x.id+'\',\'insurance_verified\',this.checked)"><span>Rugby Seguro validado</span></label>'+(x.previous_club?'<div class="passActions"><button class="btn ok" onclick="passStatus(\''+x.id+'\',\'validated\')">Validar pase</button><button class="btn bad" onclick="passStatus(\''+x.id+'\',\'rejected\')">Rechazar pase</button></div><div class="meta">Pase: '+esc(x.transfer_pass_status)+'</div>':'<div class="meta">Pase: no requerido</div>')+'<textarea id="note-'+x.id+'" class="note" placeholder="Observación de revisión">'+esc(x.review_notes||'')+'</textarea><button class="btn neutral" onclick="saveNote(\''+x.id+'\')">Guardar nota</button><div class="auto">'+(x.status==='approved'?'✅ Jugador incorporado a la base del club y acceso activado.':x.access_ready?'✅ Requisitos completos. Invitación de acceso preparada '+(x.access_invited_at?'el '+new Date(x.access_invited_at).toLocaleString('es-CL'):'')+'.':'⏳ El acceso se habilitará automáticamente cuando BD + seguro + documentos + pase queden validados.')+'</div></div></div></article>'}
function docButton(label,path,required=false){if(!path)return '<button class="doc missing" disabled>'+esc(label)+(required?' · FALTA':' · N/A')+'</button>';return '<button class="doc" onclick="openDoc(\''+escAttr(path)+'\')">📎 '+esc(label)+'</button>'}
async function openDoc(path){const {data,error}=await sb.storage.from('member-private').createSignedUrl(path,600);if(error){alert('No fue posible abrir el documento: '+error.message);return}window.open(data.signedUrl,'_blank','noopener')}
async function verify(id,field,value){const payload={[field]:value,reviewed_by:session.user.id,reviewed_at:new Date().toISOString()};const {error}=await sb.from('registration_requests').update(payload).eq('id',id);if(error)alert(error.message);await refresh()}
async function passStatus(id,status){const {error}=await sb.from('registration_requests').update({transfer_pass_status:status,reviewed_by:session.user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await refresh()}
async function saveNote(id){const v=document.getElementById('note-'+id).value.trim();const {error}=await sb.from('registration_requests').update({review_notes:v||null,reviewed_by:session.user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await refresh()}
function labelStatus(s){return ({pending:'Pendiente',contacted:'Contactado',documents_pending:'Documentos pendientes',ready:'Acceso listo',approved:'Incorporado',rejected:'Rechazado'})[s]||s}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return String(s||'').replace(/\\/g,'').replace(/'/g,'&#39;')}
</script></body></html>
