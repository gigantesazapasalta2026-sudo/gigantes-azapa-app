<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Álbum del Equipo · Gestión Gigantes</title>
<style>:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085;--ok:#166534}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111827}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1200px;margin:auto}.top h1{margin:0 0 5px}.top a{color:#f6a16f;text-decoration:none;font-weight:800}.notice,.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:14px 0}.notice{background:#fff7ed;border-color:#fed7aa;font-size:12px;line-height:1.5}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:900;cursor:pointer}.btn{background:var(--o);color:#fff}.dark{background:#111827;color:#fff}.filter{background:#fff;border:1px solid #d0d5dd}.filter.active{background:#111827;color:#fff}.row{display:grid;grid-template-columns:74px minmax(190px,1fr) 125px 105px 100px 100px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.thumb{width:64px;height:78px;border-radius:9px;object-fit:cover;background:#111827}.name{font-weight:900}.meta{font-size:11px;color:var(--m);margin-top:3px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900;background:#f3f4f6}.ok{background:#dcfce7;color:#166534}.edit{display:none;border-top:1px dashed #ddd;padding-top:12px;margin-top:8px}.edit.open{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:grid;gap:5px;font-size:10px;font-weight:900;text-transform:uppercase;color:#374151}input,select{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}.wide{grid-column:1/-1}.hide{display:none}@media(max-width:800px){.row{grid-template-columns:64px 1fr 90px}.row>*:nth-child(n+4){display:none}.grid{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div class="in"><h1>Álbum del Equipo</h1><a href="index.html">← Control Center</a> · <a href="../equipo.html">Ver álbum público</a></div></header>
<main><div id="loading" class="card">Verificando acceso…</div><section id="app" class="hide">
<div class="notice"><b>Regla:</b> una foto se publica sólo cuando la ficha está marcada como <b>Imagen autorizada</b>. Las fotos ya autorizadas se mantienen. Puedes subir una nueva foto al repositorio público del club o pegar una URL estable ya aprobada.</div>
<div class="card"><div class="filters" id="filters"></div><div id="list"></div></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let rows=[],active='Todas';
const cats=['Todas','M6','M8 / M10','M10','M10 / M12','M12','M12 / M14','M14','M16–M18','Mayores','Classic','Pendientes'];
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=album.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p||!p.active||!['superadmin','board','coach'].includes(p.role)){loading.textContent='Este módulo requiere permisos de Directiva o coach.';return}loading.classList.add('hide');app.classList.remove('hide');filters.innerHTML=cats.map((c,i)=>'<button class="filter '+(i===0?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');filters.onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;active=b.dataset.cat;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()};await refresh()})();
async function refresh(){const {data,error}=await sb.from('team_album').select('*').order('sort_order').order('display_name');if(error){list.innerHTML='<p>'+esc(error.message)+'</p>';return}rows=data||[];render()}
function render(){let data=rows;if(active==='Pendientes')data=rows.filter(x=>!x.photo_url||!x.image_authorized);else if(active!=='Todas')data=rows.filter(x=>x.category_label===active);list.innerHTML=data.length?data.map(x=>{const photo=x.photo_url&&x.image_authorized?'<img class="thumb" src="'+esc(x.photo_url)+'" onerror="this.style.visibility=\'hidden\'">':'<div class="thumb"></div>';return '<article><div class="row">'+photo+'<div><div class="name">'+esc(x.display_name)+'</div><div class="meta">'+esc(x.category_label)+'</div></div><span class="badge '+(x.image_authorized?'ok':'')+'">'+(x.image_authorized?'Foto autorizada':'Sin foto autorizada')+'</span><span>'+ (x.public_visible?'Público':'Oculto')+'</span><span>'+ (x.photo_url?'Con foto':'Sin foto')+'</span><button class="dark" onclick="toggle(\''+x.id+'\')">Editar</button></div><div class="edit" id="e-'+x.id+'"><div class="grid"><label>Categoría<select data-k="category_label">'+['M6','M8 / M10','M10','M10 / M12','M12','M12 / M14','M14','M16–M18','Mayores','Classic','M6–M10','M12–M15','Por confirmar'].map(c=>'<option '+(x.category_label===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><label>Imagen autorizada<select data-k="image_authorized"><option value="false" '+(!x.image_authorized?'selected':'')+'>No</option><option value="true" '+(x.image_authorized?'selected':'')+'>Sí</option></select></label><label>Visible públicamente<select data-k="public_visible"><option value="true" '+(x.public_visible?'selected':'')+'>Sí</option><option value="false" '+(!x.public_visible?'selected':'')+'>No</option></select></label><label class="wide">URL foto<input data-k="photo_url" value="'+attr(x.photo_url||'')+'"></label><label class="wide">Subir foto autorizada<input id="file-'+x.id+'" type="file" accept="image/jpeg,image/png,image/webp"></label></div><p><button class="btn" onclick="uploadAndSave(\''+x.id+'\')">Guardar cambios</button></p></div></article>'}).join(''):'<p class="meta">No hay fichas en este filtro.</p>'}
function toggle(id){document.getElementById('e-'+id).classList.toggle('open')}
async function uploadAndSave(id){const root=document.getElementById('e-'+id),row=rows.find(x=>x.id===id);const payload={};root.querySelectorAll('[data-k]').forEach(el=>{let v=el.value;if(el.dataset.k==='image_authorized'||el.dataset.k==='public_visible')v=v==='true';payload[el.dataset.k]=v||null});const file=document.getElementById('file-'+id).files[0];if(file){if(!payload.image_authorized&&!confirm('Has seleccionado una foto pero la ficha no está marcada como autorizada. ¿Guardar la foto sin publicarla?'))return;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const safe=(row.display_name||id).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const path='team-album/'+safe+'-'+Date.now()+'.'+ext;const up=await sb.storage.from('project-public').upload(path,file,{upsert:false,contentType:file.type});if(up.error){alert('No se pudo subir: '+up.error.message);return}payload.photo_url=sb.storage.from('project-public').getPublicUrl(path).data.publicUrl}payload.updated_at=new Date().toISOString();const {error}=await sb.from('team_album').update(payload).eq('id',id);if(error){alert(error.message);return}await refresh()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s)}
</script></body></html>
