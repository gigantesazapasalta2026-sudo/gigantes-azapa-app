<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f14"><meta name="robots" content="noindex,nofollow"><title>Acceso seguro · Mi Gigantes</title>
<style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(470px,100%);background:#fff;border:1px solid var(--l);border-radius:20px;padding:28px;box-shadow:0 20px 60px #0001}.brand{display:flex;gap:13px;align-items:center;margin-bottom:24px}.brand img{width:58px;height:58px;border-radius:50%;object-fit:cover}.brand h1{font-size:20px;margin:0}.brand p{margin:4px 0 0;color:var(--m);font-size:12px}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px;font-size:12px;line-height:1.45;margin-bottom:18px}label{display:block;font-size:11px;font-weight:900;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}.btn{width:100%;border:0;border-radius:10px;padding:13px;font-weight:900;cursor:pointer;margin-top:14px;background:var(--o);color:#fff}.btn.dark{background:var(--d)}.msg{font-size:12px;margin-top:14px;line-height:1.45;color:var(--m)}a{color:#9a3412;font-weight:800;text-decoration:none}.hide{display:none}</style></head>
<body><main class="box"><div class="brand"><img src="https://raw.githubusercontent.com/gigantesazapasalta2026-sudo/gigantes-media-archive/main/LOGO%20GIGANTES.jpeg" alt=""><div><h1>Gigantes de Azapa</h1><p>Acceso seguro · Mi Gigantes</p></div></div>
<div id="loading" class="notice">Verificando sesión segura…</div>
<section id="login" class="hide"><div class="notice">Acceso para jugadores, apoderados, entrenadores y Directiva. Cada usuario verá únicamente la información permitida por su rol.</div>
<label>Correo electrónico</label><input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.cl">
<label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
<button class="btn" id="signin">Ingresar</button><button class="btn dark" id="magic">Enviarme enlace de acceso</button><div class="msg" id="msg"></div><p class="msg" style="text-align:center"><a href="../recuperar.html">¿Olvidaste tu clave? Recuperar con RUT</a></p><p class="msg" style="text-align:center"><a href="../activar.html">Activar mi acceso por primera vez</a></p></section>
</main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const nextPath=new URLSearchParams(location.search).get('next')||'index.html';
const sb=supabase.createClient(window.GIGANTES_SUPABASE_URL,window.GIGANTES_SUPABASE_PUBLISHABLE_KEY);
const loading=document.getElementById('loading'),login=document.getElementById('login'),msg=document.getElementById('msg');
(async()=>{const {data}=await sb.auth.getSession();if(data.session){location.replace(nextPath)}else{loading.classList.add('hide');login.classList.remove('hide')}})();
signin.onclick=async()=>{msg.textContent='Ingresando…';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='No fue posible ingresar: '+error.message;return}location.replace(nextPath)};
magic.onclick=async()=>{msg.textContent='Enviando enlace…';const {error}=await sb.auth.signInWithOtp({email:email.value.trim(),options:{emailRedirectTo:new URL(nextPath,location.href).href,shouldCreateUser:false}});msg.textContent=error?'No fue posible enviar el enlace: '+error.message:'Revisa tu correo. Te enviamos un enlace seguro. Si todavía no activaste tu cuenta, utiliza la opción “Activar mi acceso”.'};
</script></body></html>
