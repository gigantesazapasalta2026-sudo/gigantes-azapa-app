<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Centro de Validación · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--m:#667085;--l:#e5e7eb;--s:#f4f6f8}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--s);color:#111827}.top{background:var(--d);color:#fff}.topin{max-width:1200px;margin:auto;padding:13px 16px;display:flex;gap:10px;align-items:center}.spacer{flex:1}.btn{border:0;border-radius:9px;padding:9px 11px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--o);color:#fff}.secondary{background:#fff;border:1px solid #d0d5dd;color:#111827}.danger{background:#991b1b;color:#fff}.ok{background:#166534;color:#fff}main{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.panel{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px;margin-bottom:12px}.metric{font-size:28px;font-weight:900}.muted{font-size:11px;color:var(--m);line-height:1.45}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900;cursor:pointer}.tabs button.active{background:#111827;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input,.toolbar select{padding:9px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.row{display:grid;grid-template-columns:minmax(210px,1.2fr) minmax(150px,.8fr) minmax(170px,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #eef0f2}.row:first-child{border-top:0}.row b{font-size:12px}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900;background:#eef2ff;color:#3730a3}.warn{background:#fef3c7;color:#92400e}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none}.fedGrid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:8px}.fedGrid label{font-size:10px;font-weight:900}.fedGrid select{width:100%;margin-top:4px;padding:8px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.noteBox{margin-top:8px}.noteBox textarea{width:100%;min-height:70px;border:1px solid #d0d5dd;border-radius:8px;padding:8px}.expiry{max-width:145px;padding:7px;border:1px solid #d0d5dd;border-radius:8px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.fedGrid{grid-template-columns:1fr 1fr}.actions{justify-content:flex-start}}</style></head><body>
<header class="top"><div class="topin"><b>Centro de Validación</b><div class="spacer"></div><a class="btn secondary" href="index.html">← Control Center</a></div></header>
<main><div id="loading">Verificando acceso…</div><div id="app" class="hidden">
<div class="grid"><div class="panel"><div class="metric" id="pendingDocs">0</div><div class="muted">Documentos por revisar</div></div><div class="panel"><div class="metric" id="approvedDocs">0</div><div class="muted">Documentos aprobados</div></div><div class="panel"><div class="metric" id="pendingFed">0</div><div class="muted">Estados Chile Rugby pendientes</div></div><div class="panel"><div class="metric" id="completePlayers">0</div><div class="muted">Fichas 100%</div></div></div>
<div class="tabs"><button data-tab="docs" class="active">Documentos</button><button data-tab="federation">Chile Rugby</button><button data-tab="summary">Resumen jugadores</button></div>
<div id="docsTab" class="panel"><div class="toolbar"><input id="docSearch" placeholder="Buscar jugador"><select id="docType"><option value="">Todos los documentos</option><option value="profile_photo">Foto</option><option value="identity_card">Cédula</option><option value="medical_authorization">Autorización médica</option><option value="insurance">Seguro</option></select><select id="docStatus"><option value="pending_review">Pendientes</option><option value="">Todos</option><option value="approved">Aprobados</option><option value="rejected">Rechazados</option><option value="expired">Vencidos</option></select></div><div id="docsList"></div></div>
<div id="federationTab" class="panel hidden"><div class="toolbar"><input id="fedSearch" placeholder="Buscar jugador"></div><div id="fedList"></div></div>
<div id="summaryTab" class="panel hidden"><div class="toolbar"><input id="sumSearch" placeholder="Buscar jugador"></div><div id="summaryList"></div></div>
</div></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.GIGANTES_AUTH_STORAGE,persistSession:true,autoRefreshToken:true}});
let profile=null,docs=[],people=[],fed=[],summaries=[],tab='docs';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labelType=t=>({profile_photo:'Foto jugador',identity_card:'Cédula vigente',medical_authorization:'Autorización médica',insurance:'Seguro',epc:'EPC',image_authorization:'Autorización imagen',travel_authorization:'Autorización viaje',other:'Otro'})[t]||t;
function personName(id){return people.find(p=>p.id===id)?.full_name||'Jugador'}
function badge(s){const c=s==='approved'?'good':s==='pending_review'?'warn':'bad';const l={approved:'Aprobado',pending_review:'En revisión',rejected:'Rechazado',expired:'Vencido'}[s]||s;return '<span class="badge '+c+'">'+esc(l)+'</span>'}
async function load(){
 const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?next=validacion.html');return}
 const {data:p}=await sb.from('profiles').select('user_id,role,active').eq('user_id',session.user.id).maybeSingle();profile=p;
 if(!p?.active||!['superadmin','board'].includes(p.role)){loading.textContent='No tienes permisos para este módulo.';return}
 const [a,b,c,d]=await Promise.all([
   sb.from('member_documents').select('*').order('uploaded_at',{ascending:false}),
   sb.from('people').select('id,full_name,category').order('full_name'),
   sb.from('federation_status').select('*'),
   sb.from('member_completion_summary').select('*').order('completion_percent',{ascending:true})
 ]);
 docs=a.data||[];people=b.data||[];fed=c.data||[];summaries=d.data||[];
 pendingDocs.textContent=docs.filter(x=>x.status==='pending_review').length;approvedDocs.textContent=docs.filter(x=>x.status==='approved').length;pendingFed.textContent=summaries.filter(x=>String(x.pending_labels||'').match(/Chile Rugby|EPC|Seguro Chile Rugby/i)).length;completePlayers.textContent=summaries.filter(x=>Number(x.completion_percent)===100).length;
 loading.classList.add('hidden');app.classList.remove('hidden');renderDocs();renderFed();renderSummary();
}
function renderDocs(){
 const q=(docSearch?.value||'').toLowerCase(),t=docType?.value||'',s=docStatus?.value||'';
 const rows=docs.filter(x=>(!t||x.document_type===t)&&(!s||x.status===s)&&(!q||personName(x.person_id).toLowerCase().includes(q)));
 docsList.innerHTML=rows.length?rows.map(x=>'<div class="row"><div><b>'+esc(personName(x.person_id))+'</b><div class="muted">'+esc(labelType(x.document_type))+' · subido '+new Date(x.uploaded_at).toLocaleString('es-CL')+'</div></div><div>'+badge(x.status)+(x.expires_at?'<div class="muted">Vence: '+esc(x.expires_at)+'</div>':'')+'</div><div><input class="expiry" type="date" value="'+esc(x.expires_at||'')+'" onchange="setExpiry(\''+x.id+'\',this.value)"><div class="muted">'+esc(x.review_notes||'Sin observación')+'</div></div><div class="actions"><button class="btn secondary" onclick="openDoc(\''+x.storage_path+'\')">Ver</button>'+(x.status!=='approved'?'<button class="btn ok" onclick="reviewDoc(\''+x.id+'\',\'approved\')">Aprobar</button>':'')+(x.status!=='rejected'?'<button class="btn danger" onclick="reviewDoc(\''+x.id+'\',\'rejected\')">Rechazar</button>':'')+'</div></div>').join(''):'<div class="muted">No hay documentos con este filtro.</div>'
}
async function openDoc(path){const {data,error}=await sb.storage.from('member-private').createSignedUrl(path,180);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')}
async function setExpiry(id,value){const {error}=await sb.from('member_documents').update({expires_at:value||null}).eq('id',id);if(error)return alert(error.message);await load()}
async function reviewDoc(id,status){
 const note=status==='rejected'?(prompt('Motivo del rechazo:','Documento ilegible, vencido o no corresponde.')||'Rechazado por Directiva'):(prompt('Observación opcional:','')||null);
 const {data:{user}}=await sb.auth.getUser();if(!user)return alert('Sesión no válida.');
 const {error}=await sb.from('member_documents').update({status,review_notes:note,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);
 if(error)return alert(error.message);await load()
}
function fedRow(p){
 const f=fed.find(x=>x.person_id===p.id)||{};
 return '<div class="row"><div><b>'+esc(p.full_name)+'</b><div class="muted">'+esc(p.category||'')+'</div></div><div style="grid-column:2/5"><div class="fedGrid"><label>BD Chile Rugby<select id="fr_'+p.id+'"><option>'+esc(f.federation_status||'Pendiente')+'</option><option>Fichado</option><option>Pendiente (Falta confirmar documentos o pagar el fichaje)</option></select></label><label>Pago registro<select id="fp_'+p.id+'"><option>'+esc(f.payment_status||'Pendiente')+'</option><option>Pago</option><option>Pendiente</option></select></label><label>EPC<select id="fe_'+p.id+'"><option>'+esc(f.epc_status||'NO TIENE')+'</option><option>TIENE</option><option>NO TIENE</option></select></label><label>Seguro<select id="fi_'+p.id+'"><option>'+esc(f.insurance_status||'PENDIENTE')+'</option><option>PAGO</option><option>PENDIENTE</option><option>PENDIENTE APROBACION</option><option>VIGENTE</option></select></label></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="saveFed(\''+p.id+'\')">Guardar estado</button></div></div></div>'
}
function renderFed(){const q=(fedSearch?.value||'').toLowerCase();const ids=new Set(summaries.map(x=>x.person_id));const rows=people.filter(p=>ids.has(p.id)&&(!q||p.full_name.toLowerCase().includes(q)));fedList.innerHTML=rows.map(fedRow).join('')}
async function saveFed(id){
 const payload={person_id:id,federation_status:document.getElementById('fr_'+id).value,payment_status:document.getElementById('fp_'+id).value,epc_status:document.getElementById('fe_'+id).value,insurance_status:document.getElementById('fi_'+id).value,updated_at:new Date().toISOString()};
 const current=fed.find(x=>x.person_id===id);let res=current?await sb.from('federation_status').update(payload).eq('id',current.id):await sb.from('federation_status').insert(payload);
 if(res.error)return alert(res.error.message);await load()
}
function renderSummary(){const q=(sumSearch?.value||'').toLowerCase();const rows=summaries.filter(x=>!q||x.full_name.toLowerCase().includes(q));summaryList.innerHTML=rows.map(x=>'<div class="row"><div><b>'+esc(x.full_name)+'</b><div class="muted">'+esc(x.category||'')+'</div></div><div><span class="badge '+(Number(x.completion_percent)===100?'good':'warn')+'">'+Number(x.completion_percent||0)+'%</span></div><div class="muted">'+esc(x.pending_labels||'Ficha completa')+'</div><div></div></div>').join('')}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;docsTab.classList.toggle('hidden',tab!=='docs');federationTab.classList.toggle('hidden',tab!=='federation');summaryTab.classList.toggle('hidden',tab!=='summary')});
['docSearch','docType','docStatus'].forEach(id=>document.getElementById(id).addEventListener(id==='docSearch'?'input':'change',renderDocs));fedSearch.oninput=renderFed;sumSearch.oninput=renderSummary;load();
</script></body></html>
