<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interesados en auspicio · Gestión Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1100px;margin:auto}.top h1{margin:0}.top a{color:#f6a16f;text-decoration:none}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:14px 0}.row{display:grid;grid-template-columns:1.4fr 1fr 170px;gap:12px;padding:14px 0;border-top:1px solid #eee;align-items:start}.meta{font-size:12px;color:var(--m);line-height:1.5}.hide{display:none}select{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:8px}.badge{display:inline-block;padding:4px 8px;background:#fff7ed;color:#9a3412;border-radius:999px;font-size:10px;font-weight:900}.msg{white-space:pre-wrap;font-size:13px}.contact a{color:#c2410c}@media(max-width:760px){.row{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Interesados en auspicio</h1><a href="index.html">← Control Center</a></div></header>
<main><div id="loading" class="card">Verificando acceso…</div><section id="app" class="hide"><div class="card"><b id="count">0</b> solicitudes registradas · <span class="meta">Datos privados para seguimiento de Directiva.</span></div><div id="list" class="card"></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let me;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=sponsors.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();me=p;if(!me||!me.active||!['superadmin','board','treasury','commission'].includes(me.role)){loading.textContent='No tienes permisos para revisar auspicios.';return}loading.classList.add('hide');app.classList.remove('hide');refresh()})();
async function refresh(){const {data,error}=await sb.from('sponsor_inquiries').select('*').order('created_at',{ascending:false}).limit(300);if(error){list.innerHTML='<div class="meta">Error: '+esc(error.message)+'</div>';return}count.textContent=(data||[]).length;list.innerHTML=(data||[]).length?(data||[]).map(x=>'<div class="row"><div><span class="badge">'+esc(x.project_code||'CLUB')+'</span><h3>'+esc(x.organization)+'</h3><div class="meta">'+new Date(x.created_at).toLocaleString('es-CL')+' · '+esc(x.interest||'Sin tipo definido')+'</div><p class="msg">'+esc(x.message||'')+'</p></div><div class="contact"><b>'+esc(x.contact_name)+'</b><div class="meta">'+(x.phone?'<a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a><br>':'')+(x.email?'<a href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a>':'')+'</div></div><div><select onchange="setStatus(\''+x.id+'\',this.value)">'+['new','contacted','qualified','confirmed','closed'].map(s=>'<option value="'+s+'" '+(x.status===s?'selected':'')+'>'+label(s)+'</option>').join('')+'</select></div></div>').join(''):'<div class="meta">Todavía no hay solicitudes de auspicio.</div>'}
async function setStatus(id,status){const {error}=await sb.from('sponsor_inquiries').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message)}
function label(s){return ({new:'Nuevo',contacted:'Contactado',qualified:'En evaluación',confirmed:'Confirmado',closed:'Cerrado'})[s]||s}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
