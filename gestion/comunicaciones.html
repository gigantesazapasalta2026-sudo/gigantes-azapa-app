<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunicaciones · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1050px;margin:auto}.top h1{margin:0}.top a{color:#f6a16f;text-decoration:none}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:11px;font-weight:900;margin:8px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}textarea{min-height:130px}.btn{border:0;background:var(--o);color:#fff;border-radius:8px;padding:10px 12px;font-weight:900;cursor:pointer}.row{padding:12px 0;border-top:1px solid #eee}.meta{font-size:12px;color:var(--m)}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="in"><h1>Comunicaciones</h1><a href="index.html">← Control Center</a></div></header><main><div id="loading">Verificando acceso…</div><section id="app" class="hide">
<div class="card"><h2>Publicar aviso</h2><label>Título</label><input id="title"><label>Mensaje</label><textarea id="body"></textarea><div class="grid"><div><label>Audiencia</label><select id="audience"><option value="club">Todo el club</option><option value="team">Equipo/categoría</option><option value="project">Proyecto/gira</option></select></div><div><label>Destino</label><select id="target"><option value="">—</option></select></div></div><label><input id="pinned" type="checkbox" style="width:auto"> Fijar aviso</label><button id="publish" class="btn">Publicar</button><span id="msg" class="meta"></span></div>
<div class="card"><h2>Avisos publicados</h2><div id="list"></div></div></section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let teams=[],projects=[];
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=comunicaciones.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p||!p.active||!['superadmin','board','coach','commission'].includes(p.role)){loading.textContent='No tienes permisos para publicar.';return}const [t,pr]=await Promise.all([sb.from('teams').select('id,name,category').eq('active',true),sb.from('projects').select('id,name,status').order('start_date',{ascending:false})]);teams=t.data||[];projects=pr.data||[];audience.onchange=renderTarget;renderTarget();loading.classList.add('hide');app.classList.remove('hide');refresh()})();
function renderTarget(){if(audience.value==='club'){target.innerHTML='<option value="">Todo el club</option>';target.disabled=true}else{target.disabled=false;const a=audience.value==='team'?teams:projects;target.innerHTML=a.map(x=>'<option value="'+x.id+'">'+x.name+(x.category?' · '+x.category:'')+'</option>').join('')}}
publish.onclick=async()=>{if(!title.value.trim()||!body.value.trim()){msg.textContent='Completa título y mensaje.';return}const {data:{user}}=await sb.auth.getUser();const row={title:title.value.trim(),body:body.value.trim(),audience_type:audience.value,pinned:pinned.checked,created_by:user.id};if(audience.value==='team')row.team_id=target.value;if(audience.value==='project')row.project_id=target.value;const {error}=await sb.from('announcements').insert(row);msg.textContent=error?'Error: '+error.message:'✅ Aviso publicado.';if(!error){title.value=body.value='';pinned.checked=false;refresh()}}
async function refresh(){const {data:a}=await sb.from('announcements').select('*').order('published_at',{ascending:false}).limit(100);const ids=(a||[]).map(x=>x.id);let counts={};if(ids.length){const {data:r}=await sb.from('announcement_reads').select('announcement_id').in('announcement_id',ids);for(const x of r||[])counts[x.announcement_id]=(counts[x.announcement_id]||0)+1}list.innerHTML=(a||[]).length?(a||[]).map(x=>'<div class="row"><b>'+x.title+'</b><div class="meta">'+x.audience_type+' · '+new Date(x.published_at).toLocaleString('es-CL')+' · '+(counts[x.id]||0)+' lectura(s)</div></div>').join(''):'<div class="meta">Sin avisos.</div>'}
</script></body></html>
