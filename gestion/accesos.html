<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesos · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1000px;margin:auto}.top h1{margin:0;font-size:22px}.top a{color:#f6a16f;text-decoration:none}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:2fr 1fr auto;gap:10px}label{font-size:11px;font-weight:900;display:block;margin-bottom:4px}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:8px;background:var(--o);color:#fff;padding:10px 12px;font-weight:900;cursor:pointer;align-self:end}.row{padding:10px 0;border-top:1px solid #eee}.rowActions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}.rowActions select{width:auto;min-width:140px;padding:7px}.btn.secondary{background:#fff;color:#111;border:1px solid var(--l)}.btn.bad{background:#991b1b}.meta{font-size:12px;color:var(--m)}.hide{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Accesos y roles</h1><a href="index.html">← Control Center</a></div></header><main><div id="loading">Verificando acceso…</div><section id="app" class="hide">
<div class="card"><h2>Invitar usuario</h2><div class="grid"><div><label>Correo</label><input id="email" type="email"></div><div><label>Rol</label><select id="role"><option value="board">Directiva</option><option value="treasury">Tesorería</option><option value="coach">Entrenador</option><option value="commission">Comisión</option><option value="member">Miembro</option></select></div><button id="invite" class="btn">Preautorizar</button></div><p class="meta">La persona entra con enlace mágico. No compartimos contraseñas comunes.</p><div id="msg" class="meta"></div></div>
<div class="card"><h2>Invitaciones activas</h2><div id="invites"></div></div>
<div class="card"><h2>Usuarios activos</h2><div id="profiles"></div></div>
</section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.GIGANTES_AUTH_STORAGE,persistSession:true,autoRefreshToken:true}});let me,userId;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=accesos.html';return}userId=session.user.id;const r=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();me=r.data;if(!me||!me.active||me.role!=='superadmin'){loading.textContent='Este módulo requiere rol superadministrador.';return}loading.classList.add('hide');app.classList.remove('hide');refresh()})();
async function refresh(){
 const [{data:i,error:ie},{data:p,error:pe}]=await Promise.all([
  sb.from('access_invitations').select('id,email,role,active,created_at').eq('active',true).order('created_at',{ascending:false}),
  sb.from('profiles').select('user_id,display_name,role,active,created_at').order('created_at',{ascending:false})
 ]);
 if(ie||pe){msg.textContent='No fue posible cargar accesos.';return}
 invites.innerHTML=(i||[]).length?(i||[]).map(x=>'<div class="row"><b>'+esc(x.email)+'</b><div class="meta">'+esc(x.role)+' · '+new Date(x.created_at).toLocaleString('es-CL')+'</div><div class="rowActions"><button class="btn bad" onclick="cancelInvite(\''+x.id+'\')">Cancelar invitación</button></div></div>').join(''):'<div class="meta">Sin invitaciones pendientes.</div>';
 profiles.innerHTML=(p||[]).length?(p||[]).map(x=>profileRow(x)).join(''):'<div class="meta">Sin usuarios todavía.</div>';
}
function profileRow(x){
 const own=x.user_id===userId,roles=['superadmin','board','treasury','coach','commission','guardian','player','member'];
 return '<div class="row"><b>'+esc(x.display_name||'Usuario')+(own?' · Tú':'')+'</b><div class="meta">'+esc(x.role)+' · '+(x.active?'Activo':'Inactivo')+'</div>'+
 (own?'<div class="meta">Tu propio rol/estado está protegido.</div>':'<div class="rowActions"><select id="role-'+x.user_id+'">'+roles.map(r=>'<option value="'+r+'" '+(r===x.role?'selected':'')+'>'+r+'</option>').join('')+'</select><select id="active-'+x.user_id+'"><option value="true" '+(x.active?'selected':'')+'>Activo</option><option value="false" '+(!x.active?'selected':'')+'>Inactivo</option></select><button class="btn secondary" onclick="saveProfile(\''+x.user_id+'\',\''+escAttr(x.role)+'\','+(x.active?'true':'false')+')">Guardar</button></div>')+'</div>';
}
async function cancelInvite(id){if(!confirm('¿Cancelar esta invitación?'))return;const {error}=await sb.from('access_invitations').update({active:false}).eq('id',id).eq('active',true);if(error)return alert(error.message);await refresh()}
async function saveProfile(id,oldRole,oldActive){
 const roleValue=document.getElementById('role-'+id).value,activeValue=document.getElementById('active-'+id).value==='true';
 if(roleValue===oldRole&&activeValue===oldActive)return;
 if(roleValue==='superadmin'&&oldRole!=='superadmin'&&!confirm('¿Promover este usuario a SUPERADMIN? Tendrá acceso administrativo amplio.'))return;
 if(!activeValue&&oldActive&&!confirm('¿Desactivar este usuario? No podrá operar con su perfil mientras esté inactivo.'))return;
 const {error}=await sb.from('profiles').update({role:roleValue,active:activeValue}).eq('user_id',id);
 if(error)return alert(error.message);await refresh();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return String(s??'').replace(/'/g,'&#39;')}
invite.onclick=async()=>{if(!email.value.trim()){msg.textContent='Ingresa un correo.';return}const {error}=await sb.from('access_invitations').insert({email:email.value.trim().toLowerCase(),role:role.value});msg.textContent=error?'Error: '+error.message:'✅ Usuario preautorizado. Ahora puede entrar usando enlace mágico.';if(!error){email.value='';refresh()}}
</script></body></html>
