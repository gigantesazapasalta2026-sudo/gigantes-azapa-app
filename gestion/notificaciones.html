<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones · Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:1050px;margin:auto}.top h1{margin:0}.top a{color:#f6a16f;text-decoration:none}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.k{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px}.k b{display:block;font-size:28px}.k span{font-size:11px;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}.row{padding:12px 0;border-top:1px solid #eee}.meta{font-size:12px;color:var(--m)}.btn{display:inline-block;background:var(--o);color:#fff;text-decoration:none;border:0;border-radius:8px;padding:8px 10px;font-weight:900;cursor:pointer}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.filters button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;cursor:pointer}.filters button.active{background:#111827;color:#fff}.hide{display:none}@media(max-width:700px){.kpis{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="in"><h1>Notificaciones</h1><a href="index.html">← Control Center</a></div></header><main><div id="loading">Verificando acceso…</div><section id="app" class="hide">
<div class="kpis"><div class="k"><b id="pendingK">0</b><span>Pendientes</span></div><div class="k"><b id="docsK">0</b><span>Documentos</span></div><div class="k"><b id="insuranceK">0</b><span>Seguro</span></div></div>
<div class="card"><h2>Cola de recordatorios</h2><p class="meta">La base genera recordatorios automáticamente. Puedes filtrarlos, abrir el correo y luego marcar la alerta como gestionada sin falsear un envío automático.</p><div class="filters"><button class="active" data-filter="all">Todos</button><button data-filter="document_missing">Documentos faltantes</button><button data-filter="document_expiry">Vencimientos</button><button data-filter="insurance_pending">Seguro</button><button data-filter="dues_overdue">Cuotas</button></div><div id="queue"></div></div>
</section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let rows=[],filter='all',profile=null;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=notificaciones.html';return}const {data:p}=await sb.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();profile=p;if(!p||!p.active||!['superadmin','board','treasury'].includes(p.role)){loading.textContent='No tienes permisos para este módulo.';return}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});await refresh();loading.classList.add('hide');app.classList.remove('hide')})();
async function refresh(){const {data,error}=await sb.from('notification_queue').select('*').eq('status','pending').order('scheduled_for',{ascending:false}).limit(500);if(error){queue.innerHTML='<div class="meta">Error: '+esc(error.message)+'</div>';return}rows=data||[];pendingK.textContent=rows.length;docsK.textContent=rows.filter(x=>x.notification_type==='document_missing').length;insuranceK.textContent=rows.filter(x=>x.notification_type==='insurance_pending').length;render()}
function render(){const data=filter==='all'?rows:rows.filter(x=>x.notification_type===filter);queue.innerHTML=data.length?data.map(x=>'<div class="row"><b>'+esc(x.subject)+'</b><div class="meta">'+esc(x.recipient_email)+' · '+esc(labelType(x.notification_type))+' · '+new Date(x.scheduled_for).toLocaleString('es-CL')+'</div><p>'+esc(x.body)+'</p><a class="btn" href="mailto:'+encodeURIComponent(x.recipient_email)+'?subject='+encodeURIComponent(x.subject)+'&body='+encodeURIComponent(x.body)+'">Abrir correo</a> <button class="btn" style="background:#166534" onclick="markHandled(\''+x.id+'\')">Marcar gestionada</button></div>').join(''):'<div class="meta">No hay recordatorios pendientes en este filtro.</div>'}
async function markHandled(id){if(!confirm('¿Marcar esta notificación como gestionada manualmente?'))return;const {data:{user}}=await sb.auth.getUser();if(!user)return alert('Sesión no válida.');const {error}=await sb.from('notification_queue').update({status:'handled',handled_at:new Date().toISOString(),handled_by:user.id}).eq('id',id).eq('status','pending');if(error)return alert(error.message);rows=rows.filter(x=>x.id!==id);pendingK.textContent=rows.length;docsK.textContent=rows.filter(x=>x.notification_type==='document_missing').length;insuranceK.textContent=rows.filter(x=>x.notification_type==='insurance_pending').length;render()}
function labelType(t){return ({document_missing:'Documento faltante',document_expiry:'Vencimiento documental',insurance_pending:'Seguro pendiente',dues_overdue:'Cuota vencida'})[t]||t}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
