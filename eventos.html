<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Eventos · Gigantes de Azapa</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111827}.hero{background:linear-gradient(135deg,#0b0f14,#2a180e);color:white;padding:72px 18px 36px}.in,main{max-width:980px;margin:auto}.hero h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 8px}.hero p{max-width:760px;color:#d1d5db}.sectionTitle{margin:28px 0 10px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin:12px 0;display:grid;grid-template-columns:110px 1fr;gap:18px}.date{background:#111;color:#fff;border-radius:12px;padding:12px;text-align:center}.date b{display:block;font-size:2rem;color:var(--o)}.meta{font-size:13px;color:var(--m);line-height:1.6}.tag{display:inline-block;background:#fff7ed;color:#9a3412;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;margin-bottom:6px}.empty{background:#fff;border:1px solid var(--l);border-radius:14px;padding:24px;color:var(--m)}@media(max-width:620px){.card{grid-template-columns:1fr}.date{text-align:left}.date b{display:inline;margin-right:6px}}.eventPhotos{max-width:1080px;margin:22px auto 0;padding:0 18px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.eventPhotos img{width:100%;height:190px;object-fit:cover;border-radius:16px;filter:saturate(1.08) contrast(1.04)}@media(max-width:700px){.eventPhotos{grid-template-columns:1fr 1fr}.eventPhotos img:first-child{grid-column:1/3;height:220px}}</style></head><body>
<section class="hero"><div class="in"><h1>📅 Eventos y actividades</h1><p>Agenda pública del club: entrenamientos abiertos, partidos, giras, campeonatos, bingos, ventas y actividades de recaudación. Así se construye Gigantes de Azapa.</p><a href="index.html" style="color:#f6a16f">← Volver al inicio</a></div></section><div class="eventPhotos"><img src="https://raw.githubusercontent.com/gigantesazapasalta2026-sudo/gigantes-media-archive/main/app-2026/dia-del-nino.jpg" alt="Actividad familiar del club"><img src="https://raw.githubusercontent.com/gigantesazapasalta2026-sudo/gigantes-media-archive/main/app-2026/entrenamiento-playa.jpg" alt="Entrenamiento en playa"><img src="https://raw.githubusercontent.com/gigantesazapasalta2026-sudo/gigantes-media-archive/main/app-2026/compartiendo-otros-equipos.jpg" alt="Encuentro con otros clubes"></div>
<main><h2 class="sectionTitle">Próximamente</h2><div id="upcoming" class="empty">Cargando…</div><h2 class="sectionTitle">Actividad reciente</h2><div id="past" class="empty">Cargando…</div></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);const now=new Date();const since=new Date(Date.now()-120*86400000);let pmap={};
(async()=>{const [er,fr,pr]=await Promise.all([
 sb.from('events').select('id,title,event_type,starts_at,ends_at,location_name,notes,project_id').eq('public_visible',true).eq('active',true).gte('starts_at',since.toISOString()).order('starts_at',{ascending:true}),
 sb.from('fundraising_activities').select('id,title,activity_type,event_date,status,public_summary,project_id').eq('public_visible',true).in('status',['planned','active','completed']).gte('event_date',since.toISOString().slice(0,10)).order('event_date'),
 sb.from('projects').select('id,public_slug,code').eq('public_visible',true)
]);pmap=Object.fromEntries((pr.data||[]).map(p=>[p.id,p.public_slug||p.code]));if(er.error||fr.error){upcoming.textContent=past.textContent='No fue posible cargar la agenda.';return}
const events=(er.data||[]).map(x=>({...x,sortDate:new Date(x.starts_at),dateOnly:false}));
const funds=(fr.data||[]).map(x=>({id:'f-'+x.id,title:x.title,event_type:'fundraising',starts_at:x.event_date+'T12:00:00',sortDate:new Date(x.event_date+'T12:00:00'),dateOnly:true,location_name:null,notes:x.public_summary,project_id:x.project_id,status:x.status}));
const all=events.concat(funds).sort((a,b)=>a.sortDate-b.sortDate);
const u=all.filter(x=>x.sortDate>=new Date(now.toDateString())&&(!x.status||x.status!=='completed')),p=all.filter(x=>x.sortDate<new Date(now.toDateString())||x.status==='completed').sort((a,b)=>b.sortDate-a.sortDate);
render(upcoming,u,'No hay próximos eventos publicados.');render(past,p.slice(0,30),'Aún no hay actividad reciente publicada.')})();
function render(el,arr,empty){if(!arr.length){el.className='empty';el.textContent=empty;return}el.className='';el.innerHTML=arr.map(x=>{const d=x.sortDate||new Date(x.starts_at);return '<article class="card"><div class="date"><b>'+d.getDate()+'</b>'+d.toLocaleDateString('es-CL',{month:'short',year:'numeric'})+'</div><div><span class="tag">'+label(x.event_type)+'</span><h2>'+esc(x.title)+'</h2><div class="meta">'+(x.dateOnly?'📅 Actividad del día':'🕒 '+d.toLocaleString('es-CL'))+(x.location_name?' · 📍 '+esc(x.location_name):'')+'</div>'+(x.notes?'<p class="meta">'+esc(x.notes)+'</p>':'')+(x.event_type==='fundraising'?'<p><a href="recaudacion.html" style="color:#c2410c;font-weight:900;text-decoration:none">Ver recaudación →</a></p>':x.project_id&&pmap[x.project_id]?'<p><a href="proyecto.html?slug='+encodeURIComponent(pmap[x.project_id])+'" style="color:#c2410c;font-weight:900;text-decoration:none">Ver proyecto →</a></p>':'')+'</div></article>'}).join('')}
function label(t){return ({training:'Entrenamiento',match:'Partido',meeting:'Reunión',activity:'Actividad',fundraising:'Recaudación',tour:'Gira / Viaje'})[t]||'Actividad'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script><script src="form-bridge.js"></script></body></html>
