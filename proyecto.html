<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Proyecto · Gigantes de Azapa</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.hero{background:linear-gradient(135deg,#0b0f14,#352014);color:#fff;padding:64px 20px 34px}.in,main{max-width:1050px;margin:auto}.hero h1{margin:0 0 8px;font-size:clamp(2rem,6vw,4rem)}.hero p{color:#d1d5db;max-width:760px}.meta{font-size:13px;color:#f8b58d}.back{display:inline-block;margin-top:14px;color:#fff;text-decoration:none;font-weight:800}main{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px}.card h2{font-size:17px;margin:0 0 10px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px}.k b{display:block;font-size:20px}.k span{font-size:11px;color:var(--m)}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.gallery div{background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px}.empty{color:var(--m);font-size:13px}@media(max-width:700px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body>
<section class="hero"><div class="in"><div id="status" class="meta"></div><h1 id="title">Proyecto</h1><p id="objective"></p><div id="meta" class="meta"></div><a class="back" href="proyectos.html">← Proyectos y giras</a></div></section>
<main><div class="kpis"><div class="k"><span>Fecha</span><b id="dates">—</b></div><div class="k"><span>Ubicación</span><b id="location">—</b></div><div class="k"><span>Estado</span><b id="state">—</b></div></div>
<div class="grid" style="margin-top:14px"><section class="card"><h2>🎯 Objetivos</h2><div id="goals" class="empty">Sin objetivos publicados aún.</div></section><section class="card"><h2>📌 Hitos</h2><div id="milestones" class="empty">Sin hitos publicados aún.</div></section></div>
<section class="card" style="margin-top:14px"><h2>📸 Memoria del proyecto</h2><div id="gallery" class="gallery"><div class="empty">Las imágenes autorizadas aparecerán aquí.</div></div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);const slug=new URLSearchParams(location.search).get('slug');
(async()=>{const {data:p,error}=await sb.from('projects').select('id,code,name,status,event_date,project_type,start_date,end_date,location,objective,public_slug').eq('public_visible',true).or('public_slug.eq.'+slug+',code.eq.'+slug).maybeSingle();if(error||!p){title.textContent='Proyecto no encontrado';objective.textContent='Este proyecto no está publicado o no existe.';return}title.textContent=p.name;objective.textContent=p.objective||'';status.textContent=(p.project_type||'Proyecto').toUpperCase();dates.textContent=p.start_date?(p.start_date+(p.end_date?' → '+p.end_date:'')):(p.event_date||'—');location.textContent=p.location||'—';state.textContent=(p.status||'—').toUpperCase();meta.textContent=[p.code,p.project_type].filter(Boolean).join(' · ');
const [{data:g},{data:m},{data:media}]=await Promise.all([sb.from('project_goals').select('*').eq('project_id',p.id),sb.from('project_milestones').select('*').eq('project_id',p.id).order('due_date'),sb.from('project_media').select('*').eq('project_id',p.id).eq('public_approved',true).order('taken_at',{ascending:false})]);
if(g&&g.length)goals.innerHTML=g.map(x=>'<p><b>'+x.title+'</b><br><span class="empty">'+Number(x.current_value||0)+' / '+Number(x.target_value||0)+' '+(x.unit||'')+' · '+(x.status||'')+'</span></p>').join('');
if(m&&m.length)milestones.innerHTML=m.map(x=>'<p><b>'+x.title+'</b><br><span class="empty">'+(x.due_date||'')+' · '+(x.progress||0)+'% · '+(x.status||'')+'</span></p>').join('');
if(media&&media.length)gallery.innerHTML=media.map(x=>{const u=sb.storage.from('project-public').getPublicUrl(x.storage_path).data.publicUrl;return '<div><img src="'+u+'" alt="'+(x.title||'Imagen')+'" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px"><b>'+(x.title||'Imagen')+'</b><p class="empty">'+(x.caption||'')+'</p></div>'}).join('');
})();
</script></body></html>
