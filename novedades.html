<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Novedades · Mi Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.top{background:#0b0f14;color:#fff;padding:18px}.in,main{max-width:900px;margin:auto}.top h1{margin:0;font-size:22px}.top a{color:#f6a16f;text-decoration:none}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0}.pin{display:inline-block;background:#fff7ed;color:#9a3412;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.meta{font-size:12px;color:var(--m)}.body{white-space:pre-wrap;line-height:1.55}.btn{border:0;background:var(--o);color:white;border-radius:8px;padding:9px 11px;font-weight:900;cursor:pointer}.read{opacity:.72}.hide{display:none}</style></head><body><header class="top"><div class="in"><h1>Novedades del club</h1><a href="mi_jugador.html">← Mi Gigantes</a></div></header><main><div id="loading">Cargando novedades…</div><section id="feed" class="hide"></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let user;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='gestion/login.html?next=../novedades.html';return}user=session.user;const [{data:a},{data:r}]=await Promise.all([sb.from('announcements').select('*').order('pinned',{ascending:false}).order('published_at',{ascending:false}),sb.from('announcement_reads').select('announcement_id').eq('user_id',user.id)]);const read=new Set((r||[]).map(x=>x.announcement_id));feed.innerHTML=(a||[]).length?(a||[]).map(x=>'<article class="card '+(read.has(x.id)?'read':'')+'">'+(x.pinned?'<span class="pin">FIJADO</span>':'')+'<h2>'+x.title+'</h2><div class="meta">'+new Date(x.published_at).toLocaleString('es-CL')+'</div><p class="body">'+x.body+'</p>'+(read.has(x.id)?'<span class="meta">✓ Leído</span>':'<button class="btn" onclick="markRead(\''+x.id+'\')">Marcar como leído</button>')+'</article>').join(''):'<div class="card meta">Todavía no hay novedades publicadas.</div>';loading.classList.add('hide');feed.classList.remove('hide')})();
async function markRead(id){const {error}=await sb.from('announcement_reads').upsert({announcement_id:id,user_id:user.id,read_at:new Date().toISOString()},{onConflict:'announcement_id,user_id'});if(error){alert(error.message);return}location.reload()}
</script></body></html>
