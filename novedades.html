<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Novedades · Gigantes de Azapa</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.hero{background:linear-gradient(135deg,#0b0f14,#2a180e);color:#fff;padding:72px 18px 36px}.in,main{max-width:940px;margin:auto}.hero h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 8px}.hero p{color:#d1d5db;max-width:720px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tab.active{background:#111;color:#fff}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0}.pin{display:inline-block;background:#fff7ed;color:#9a3412;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.meta{font-size:12px;color:var(--m)}.body{white-space:pre-wrap;line-height:1.6}.empty{padding:28px;text-align:center;color:var(--m)}a{color:#c2410c;font-weight:800;text-decoration:none}</style></head><body>
<section class="hero"><div class="in"><h1>📣 Novedades</h1><p>Conoce lo que está haciendo Gigantes de Azapa: actividades, giras, campeonatos, recaudaciones, bingos, ventas, encuentros y avances del club.</p><a href="index.html" style="color:#f6a16f">← Volver al inicio</a></div></section>
<main><div id="loading" class="card">Cargando novedades públicas…</div><section id="feed"></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);
(async()=>{const [{data:a,error},{data:ps}]=await Promise.all([sb.from('announcements').select('id,title,body,pinned,published_at,audience_type,project_id,team_id').eq('public_visible',true).eq('active',true).lte('published_at',new Date().toISOString()).order('pinned',{ascending:false}).order('published_at',{ascending:false}).limit(100),sb.from('projects').select('id,public_slug,code').eq('public_visible',true)]);const pmap=Object.fromEntries((ps||[]).map(p=>[p.id,p.public_slug||p.code]));
loading.remove();if(error){feed.innerHTML='<div class="card empty">No fue posible cargar las novedades.</div>';return}
feed.innerHTML=(a||[]).length?(a||[]).map(x=>'<article class="card">'+(x.pinned?'<span class="pin">DESTACADO</span>':'')+'<h2>'+esc(x.title)+'</h2><div class="meta">'+new Date(x.published_at).toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})+'</div><p class="body">'+esc(x.body)+'</p>'+(x.project_id&&pmap[x.project_id]?'<p><a href="proyecto.html?slug='+encodeURIComponent(pmap[x.project_id])+'">Ver proyecto y avances →</a></p>':'')+'</article>').join(''):'<div class="card empty">Todavía no hay novedades públicas.</div>'})();
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script><script src="form-bridge.js"></script></body></html>
