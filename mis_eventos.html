<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis eventos · Mi Gigantes</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f4f6f8;color:#111}.top{background:#0b0f14;color:#fff;padding:16px}.in,main{max-width:900px;margin:auto}.top a{color:#f6a16f;text-decoration:none}.family{display:flex;gap:8px;overflow:auto;margin:16px 0}.pill{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:99px;padding:9px 12px;font-weight:800}.pill.active{background:#111;color:#fff}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:12px}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:900;cursor:pointer}.yes{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}.maybe{background:#fef3c7;color:#92400e}.meta{font-size:12px;color:var(--m)}.hide{display:none}</style></head><body>
<header class="top"><div class="in"><b>Mis eventos</b><div><a href="mi_jugador.html">← Mi Gigantes</a></div></div></header><main><div id="loading">Cargando…</div><section id="app" class="hide"><div id="family" class="family"></div><div id="events"></div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let people=[],person;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='gestion/login.html?next=../mis_eventos.html';return}const {data:own}=await sb.from('people').select('*').eq('auth_user_id',session.user.id).maybeSingle();const {data:links}=await sb.from('guardian_links').select('child_person_id').eq('guardian_user_id',session.user.id);let children=[];const ids=(links||[]).map(x=>x.child_person_id);if(ids.length){const r=await sb.from('people').select('*').in('id',ids);children=r.data||[]}people=[...(own?[own]:[]),...children.filter(x=>!own||x.id!==own.id)];if(!people.length){loading.textContent='No hay jugadores vinculados.';return}family.innerHTML=people.map((p,i)=>'<button class="pill '+(i===0?'active':'')+'" data-id="'+p.id+'">'+p.full_name+'</button>').join('');family.querySelectorAll('button').forEach(b=>b.onclick=()=>selectPerson(b.dataset.id));loading.classList.add('hide');app.classList.remove('hide');selectPerson(people[0].id)})();
async function selectPerson(id){person=people.find(x=>x.id===id);family.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const [er,rr]=await Promise.all([sb.from('events').select('*').eq('active',true).gte('starts_at',new Date().toISOString()).order('starts_at'),sb.from('event_responses').select('*').eq('person_id',id)]);const map=Object.fromEntries((rr.data||[]).map(x=>[x.event_id,x.response]));events.innerHTML=(er.data||[]).length?(er.data||[]).map(x=>'<div class="card"><b>'+x.title+'</b><div class="meta">'+new Date(x.starts_at).toLocaleString('es-CL')+' · '+(x.location_name||'Lugar por definir')+(x.capacity?' · '+x.capacity+' cupos':'')+'</div><p class="meta">'+(x.notes||'')+'</p><button class="btn yes" onclick="respond(\''+x.id+'\',\'yes\')">Voy '+(map[x.id]==='yes'?'✓':'')+'</button> <button class="btn maybe" onclick="respond(\''+x.id+'\',\'maybe\')">Tal vez '+(map[x.id]==='maybe'?'✓':'')+'</button> <button class="btn no" onclick="respond(\''+x.id+'\',\'no\')">No voy '+(map[x.id]==='no'?'✓':'')+'</button>'+(map[x.id]==='waitlist'?'<p class="meta"><b>⏳ Lista de espera</b> · Te avisaremos cuando se libere un cupo.</p>':'')+'</div>').join(''):'<div class="card meta">No hay próximos eventos.</div>'}
async function respond(event,response){const {data,error}=await sb.from('event_responses').upsert({event_id:event,person_id:person.id,response,responded_at:new Date().toISOString()},{onConflict:'event_id,person_id'}).select('response').single();if(error){alert(error.message);return}if(data?.response==='waitlist')alert('El evento está completo. Quedaste en lista de espera.');selectPerson(person.id)}
</script></body></html>
