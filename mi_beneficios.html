<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><meta name="robots" content="noindex,nofollow"><title>Mi Credencial · Beneficios Gigantes</title>
<style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085;--ok:#166534;--bad:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.top{background:var(--d);color:#fff;padding:16px}.in,main{max-width:960px;margin:auto}.topin{display:flex;align-items:center;gap:12px}.top h1{margin:0;font-size:21px}.top p{margin:3px 0 0;color:#f7a472;font-size:11px}.top a{margin-left:auto;color:#fff;text-decoration:none;font-weight:800}.family{display:flex;gap:8px;overflow:auto;margin:16px 0}.person{white-space:nowrap;border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.person.active{background:var(--d);color:#fff}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:12px 0}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.ok{background:#dcfce7;color:var(--ok)}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.partner h3{margin:5px 0}.partner p{font-size:12px;color:var(--m)}.btn{border:0;border-radius:9px;background:var(--o);color:#fff;font-weight:900;padding:9px 11px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{padding:12px;border:1px solid #fed7aa;background:#fff7ed;border-radius:10px;font-size:12px}.hidden{display:none}dialog{border:0;border-radius:16px;width:min(92vw,430px);padding:0;box-shadow:0 30px 80px #0005}dialog::backdrop{background:#0009}.modal{padding:20px;text-align:center}.modal canvas{max-width:100%;height:auto;margin:12px auto}.token{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;background:#f4f4f5;padding:9px;border-radius:8px}.count{font-size:26px;font-weight:900}.close{background:#111827}.muted{color:var(--m);font-size:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header class="top"><div class="in topin"><div><h1>🎁 Mi Credencial</h1><p>Beneficios Gigantes · código dinámico</p></div><a href="mi_jugador.html">← Mi Gigantes</a></div></header>
<main><div id="loading" class="notice">Verificando tu membresía…</div><section id="app" class="hidden">
<div id="family" class="family"></div>
<div class="card hero"><div><h2 id="personName">Miembro</h2><p id="kind" class="muted"></p></div><span id="eligibility" class="badge warn">Consultando</span></div>
<div id="eligibilityNote" class="notice"></div>
<h2>Convenios disponibles</h2><div id="partners" class="grid"></div>
</section></main>
<dialog id="credential"><div class="modal"><h2 id="credentialTitle">Código de beneficio</h2><canvas id="qr" width="280" height="280"></canvas><p class="muted">Este código vence automáticamente.</p><div id="countdown" class="count">03:00</div><p id="tokenText" class="token"></p><button id="closeCredential" class="btn close">Cerrar</button></div></dialog>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);let persons=[],current=null,partnerRows=[],eligible=false,timer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='gestion/login.html?next=../mi_beneficios.html';return}
 const [{data:own},{data:links},{data:partnersData}]=await Promise.all([
  sb.from('people').select('id,full_name').eq('auth_user_id',session.user.id).maybeSingle(),
  sb.from('guardian_links').select('child_person_id').eq('guardian_user_id',session.user.id),
  sb.from('benefit_partners').select('id,name,benefit_title,conditions,discount_percent,starts_on,ends_on').eq('active',true).order('featured',{ascending:false}).order('name')
 ]);
 let children=[];const ids=(links||[]).map(x=>x.child_person_id);if(ids.length){const r=await sb.from('people').select('id,full_name').in('id',ids);children=r.data||[]}
 persons=[...(own?[own]:[]),...children.filter(x=>!own||x.id!==own.id)];partnerRows=partnersData||[];
 if(!persons.length){loading.textContent='Tu cuenta no tiene personas vinculadas para beneficios.';return}
 family.innerHTML=persons.map((p,i)=>'<button class="person'+(i===0?' active':'')+'" data-id="'+p.id+'">'+esc(p.full_name)+'</button>').join('');
 family.querySelectorAll('button').forEach(b=>b.onclick=()=>selectPerson(b.dataset.id));loading.classList.add('hidden');app.classList.remove('hidden');await selectPerson(persons[0].id);
})();
async function selectPerson(id){current=persons.find(x=>x.id===id);family.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));personName.textContent=current.full_name;eligibility.textContent='Consultando';eligibility.className='badge warn';
 const r=await sb.rpc('get_my_benefit_status',{p_person_id:id});if(r.error){eligible=false;eligibility.textContent='No disponible';eligibility.className='badge bad';eligibilityNote.textContent='No pudimos verificar la membresía.';renderPartners();return}
 eligible=!!r.data?.eligible;const type=r.data?.kind==='player'?'Jugador Gigante':'Hincha Gigante';kind.textContent=type+' · período '+String(r.data?.period||'').slice(0,7);
 eligibility.textContent=eligible?'HABILITADO':'PENDIENTE';eligibility.className='badge '+(eligible?'ok':'warn');
 eligibilityNote.textContent=eligible?'Tu membresía está habilitada para usar convenios. Genera el código recién cuando estés en el establecimiento.':(r.data?.kind==='player'?'Para usar beneficios, la cuota deportiva del mes debe estar al día y no existir deuda anterior.':'Para usar beneficios, la mensualidad Hincha Gigante de $2.000 del mes debe estar verificada.');
 renderPartners();
}
function renderPartners(){const now=new Date().toISOString().slice(0,10),rows=partnerRows.filter(p=>p.starts_on<=now&&(!p.ends_on||p.ends_on>=now));partners.innerHTML=rows.length?rows.map(p=>'<article class="card partner"><span class="badge ok">'+(p.discount_percent!=null?esc(p.discount_percent)+'%':'Convenio')+'</span><h3>'+esc(p.name)+'</h3><strong>'+esc(p.benefit_title)+'</strong><p>'+esc(p.conditions)+'</p><button class="btn" '+(eligible?'':'disabled')+' onclick="issue(\''+p.id+'\',\''+esc(p.name).replace(/'/g,"&#39;")+'\')">Generar código</button></article>').join(''):'<div class="notice">No hay convenios vigentes publicados.</div>'}
async function issue(partnerId,partnerName){if(!current||!eligible)return;const r=await sb.rpc('issue_benefit_token',{p_person_id:current.id,p_partner_id:partnerId});if(r.error){alert(r.error.message||'No fue posible generar el código.');await selectPerson(current.id);return}const token=r.data,verifyUrl=new URL('validar_beneficio.html',location.href);verifyUrl.searchParams.set('token',token);credentialTitle.textContent='Código · '+partnerName;tokenText.textContent=token;credential.showModal();if(timer)clearInterval(timer);let left=180;countdown.textContent='03:00';timer=setInterval(()=>{left--;const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');countdown.textContent=m+':'+s;if(left<=0){clearInterval(timer);countdown.textContent='VENCIDO'}},1000);if(window.QRCode?.toCanvas)QRCode.toCanvas(qr,verifyUrl.toString(),{width:280,margin:1},()=>{});}
closeCredential.onclick=()=>{if(timer)clearInterval(timer);credential.close()};
</script></body></html>
