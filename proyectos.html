<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Proyectos y giras · Gigantes de Azapa</title><style>
:root{--o:#f36b21;--d:#0b0f14;--l:#e5e7eb;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#111827}.hero{background:linear-gradient(135deg,#0b0f14,#352014);color:white;padding:72px 20px 38px}.in{max-width:1100px;margin:auto}.hero h1{margin:0;font-size:clamp(2.2rem,6vw,4.6rem)}.hero p{color:#d1d5db;max-width:700px;line-height:1.5}.main{max-width:1100px;margin:auto;padding:22px}.section{margin-bottom:28px}.section h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:white;border:1px solid var(--l);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}.cover{width:100%;height:150px;object-fit:contain;background:#f8fafc;border-radius:12px;padding:10px}.badge{display:inline-block;align-self:flex-start;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e}.closed{background:#e5e7eb;color:#374151}.card h3{margin:0;font-size:18px}.meta{color:var(--m);font-size:12px;line-height:1.45}.btn{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--o);color:#fff;border-radius:9px;padding:10px 12px;font-weight:900}.empty{color:var(--m);font-size:13px}.nav{margin-top:18px}.nav a{color:#fff;text-decoration:none;font-weight:800}</style></head>
<body><section class="hero"><div class="in"><h1>Proyectos y giras</h1><p>Cada gira, campeonato o proyecto importante de Gigantes de Azapa tiene su propio espacio de gestión, metas, participantes, documentos, presupuesto, fotografías y cierre histórico.</p><div class="nav"><a href="index.html">← Volver al club</a></div></div></section>
<main class="main"><section class="section"><h2>Activos</h2><div id="active" class="grid"></div></section><section class="section"><h2>Historial</h2><div id="history" class="grid"></div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient(GIGANTES_SUPABASE_URL,GIGANTES_SUPABASE_PUBLISHABLE_KEY);
function card(p){const status=(p.status||'').toLowerCase();const hist=status==='closed';const dates=p.start_date?(p.start_date+(p.end_date?' → '+p.end_date:'')):(p.event_date||'');return '<article class="card">'+(p.cover_image_path?'<img class="cover" src="'+p.cover_image_path+'" alt="'+p.name+'">':'')+'<span class="badge '+(hist?'closed':'')+'">'+(hist?'HISTÓRICO':'ACTIVO')+'</span><h3>'+p.name+'</h3><div class="meta">'+[p.project_type,p.location,dates].filter(Boolean).join(' · ')+'</div><div class="meta">'+(p.objective||'')+'</div><a class="btn" href="proyecto.html?slug='+encodeURIComponent(p.public_slug||p.code)+'">Ver proyecto</a></article>'}
(async()=>{const {data,error}=await sb.from('projects').select('code,name,status,event_date,project_type,start_date,end_date,location,objective,public_slug,cover_image_path').eq('public_visible',true).order('start_date',{ascending:false});if(error){active.innerHTML='<div class="empty">No fue posible cargar los proyectos.</div>';return}const a=data.filter(x=>String(x.status).toLowerCase()!=='closed'),h=data.filter(x=>String(x.status).toLowerCase()==='closed');active.innerHTML=a.length?a.map(card).join(''):'<div class="empty">No hay proyectos activos publicados.</div>';history.innerHTML=h.length?h.map(card).join(''):'<div class="empty">Todavía no hay proyectos históricos publicados.</div>'})();
</script></body></html>
